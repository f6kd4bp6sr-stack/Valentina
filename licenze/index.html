<script>
/* ================= BLOCCO CON FACE ID (comune a tutte le pagine di Pianificazione) =================
   - usa una passkey del dispositivo (WebAuthn): l'iPad chiede Face ID, o il codice dell'iPad se il volto non viene riconosciuto;
   - nessun server: la chiave pubblica resta su questo dispositivo e la firma si verifica qui;
   - codice di riserva (4–8 cifre) se la passkey non fosse disponibile;
   - si riblocca dopo 5 minuti fuori dall'app. I dati restano dove sono: il blocco protegge l'apertura, non cifra i dati. */
(function(){
  "use strict";
  var KEY="pn-lock", SES="pn-unlocked", IDLE=5*60*1000;
  function cfg(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}
  var C=cfg(), root=document.documentElement;
  function unlocked(){try{var t=+sessionStorage.getItem(SES)||0;return t&&Date.now()-t<IDLE;}catch(e){return false;}}
  function mark(){try{sessionStorage.setItem(SES,String(Date.now()));}catch(e){}}
  if(C&&C.on&&!unlocked())root.classList.add("locked");
  var b64=function(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
  var unb64=function(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};
  function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
  async function sha(t){var h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return b64(h);}
  // firma ES256 (DER) → formato grezzo r|s per WebCrypto
  function der2raw(d){var i=2;if(d[1]&0x80)i+=d[1]&0x7f;function int(){i++;var l=d[i++];var v=d.slice(i,i+l);i+=l;while(v.length>32&&v[0]===0)v=v.slice(1);var o=new Uint8Array(32);o.set(v,32-v.length);return o;}var r=int(),s=int(),out=new Uint8Array(64);out.set(r,0);out.set(s,32);return out;}
  async function verify(pkB64,authData,clientJSON,sig){
    try{var key=await crypto.subtle.importKey("spki",unb64(pkB64),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
      var ch=new Uint8Array(await crypto.subtle.digest("SHA-256",clientJSON)),ad=new Uint8Array(authData),data=new Uint8Array(ad.length+ch.length);data.set(ad,0);data.set(ch,ad.length);
      return await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,der2raw(new Uint8Array(sig)),data);}catch(e){return null;}
  }
  function done(){mark();root.classList.remove("locked");try{window.dispatchEvent(new Event("pn-unlocked"));}catch(e){}}
  function msg(t){var e=document.getElementById("lkMsg");if(e)e.textContent=t;}
  var busy=false;
  async function faceId(){
    C=cfg(); if(!C||!C.id){showPin();return;}
    if(busy)return; busy=true; msg("Guarda l’iPad…");
    try{
      var chal=rnd(32);
      var a=await navigator.credentials.get({publicKey:{challenge:chal,rpId:location.hostname,allowCredentials:[{type:"public-key",id:unb64(C.id)}],userVerification:"required",timeout:60000}});

      if(cj.type!=="webauthn.get"||cj.challenge!==b64(chal))throw new Error("risposta non valida");
      var flags=new Uint8Array(r.authenticatorData)[32];if(!(flags&4))throw new Error("verifica del volto non fatta");
      if(C.pk){var ok=await verify(C.pk,r.authenticatorData,r.clientDataJSON,r.signature);if(ok===false)throw new Error("firma non valida");}
      done();
    }catch(e){msg(e&&e.name==="NotAllowedError"?"Tocca «Sblocca con Face ID» per riprovare, o usa il codice di riserva.":"Non riuscito: riprova o usa il codice di riserva.");}
    busy=false;
  }
  function showPin(){var b=document.getElementById("lkPinBox");if(b){b.hidden=false;var i=document.getElementById("lkPin");if(i)i.focus();}}
  async function pin(){var v=(document.getElementById("lkPin").value||"").trim();C=cfg();
    if(C&&C.pin&&await sha("pn-pin:"+v)===C.pin){done();document.getElementById("lkPin").value="";document.getElementById("lkErr").textContent="";}
    else{document.getElementById("lkErr").textContent="Codice sbagliato";}}

  return o;}

  if($("pM"))$("pM").onchange=e=>pset("mesi",+e.target.value);

  document.querySelectorAll("[data-xdel]").forEach(b=>b.onclick=()=>{c.proj.extra.splice(+b.dataset.xdel,1);save();render();});

/* ================= 📊 STATISTICHE e 💡 RISPARMIO =================
   Calcoli fatti sui movimenti importati (giroconti tra i propri conti esclusi). Nessun consiglio di investimento:
   numeri e strategie generali di gestione del bilancio, le decisioni restano dell'utente. */
let SP=12; // periodo in mesi
const STOP=/^(sepa|direct|debit|addebito|sdd|fattura|fattur|a|vs|carico|da|per|mand|srl|spa|s|p|a|sa|rl|sarl|et|ci|cie|carta|pagamento|visa|presso|it|lt|torino|bonifico|istantaneo|italia|estero|beneficiario|ord|ben|di|del|della|e|il|la|in|su|the)$/;
function merchKey(t){let s=String(t||"").toLowerCase();if(s.includes(" · "))s=s.split(" · ").slice(1).join(" ");
  const w=s.replace(/[^a-zàèéìòù ]/g," ").split(/\s+/).filter(x=>x.length>2&&!STOP.test(x));return w.slice(0,2).map(x=>x[0].toUpperCase()+x.slice(1)).join(" ")||"Altro";}
function periodMonths(n){return lastMonths(n+1).slice(0,n);} // mesi completi (escluso il mese in corso)
function outMov(ms){const set=new Set(ms);return C().mov.filter(m=>m.tipo==="u"&&!isTransfer(m)&&set.has(m.d.slice(0,7)));}
function stats(n){const ms=periodMonths(n),A=ms.map(ym=>Object.assign({ym},monthActual(ym))).filter(x=>x.e||x.u);
  const k=A.length||1,E=A.reduce((s,x)=>s+x.e,0)/k,U=A.reduce((s,x)=>s+x.u,0)/k;
  const per={};A.forEach(x=>Object.entries(x.per).forEach(([c,v])=>per[c]=(per[c]||0)+v));
  const half=Math.floor(A.length/2),rec=A.slice(-Math.min(3,half)),pre=A.slice(-2*Math.min(3,half),-Math.min(3,half));
  const trend={};Object.keys(per).forEach(c=>{const r=rec.reduce((s,x)=>s+(x.per[c]||0),0)/(rec.length||1),p=pre.reduce((s,x)=>s+(x.per[c]||0),0)/(pre.length||1);trend[c]=p>0?(r-p)/p:null;});
  const mv=outMov(ms),small=mv.filter(m=>m.imp<10);
  const giro=C().mov.filter(m=>m.cat==="giro"&&m.tipo==="u"&&ms.includes(m.d.slice(0,7))).reduce((s,m)=>s+m.imp,0)/k;
  const best=A.slice().sort((a,b)=>(b.e-b.u)-(a.e-a.u));
  const merch={};mv.forEach(m=>{const key=merchKey(m.t);merch[key]=(merch[key]||0)+m.imp;});
  return{ms,A,k,E,U,per,trend,small:{n:small.length,tot:small.reduce((s,m)=>s+m.imp,0)},giro,best:best[0],worst:best[best.length-1],merch:Object.entries(merch).sort((a,b)=>b[1]-a[1]).slice(0,10)};}
/* addebiti che si ripetono quasi ogni mese con importi simili: spese fisse */
function recurring(n){const ms=periodMonths(Math.max(n,6)),g={};outMov(ms).forEach(m=>{const k=merchKey(m.t);(g[k]=g[k]||[]).push(m);});
  const out=[];Object.entries(g).forEach(([k,L])=>{const months=new Set(L.map(m=>m.d.slice(0,7)));if(months.size<Math.max(3,ms.length*.55))return;
    const perM={};L.forEach(m=>perM[m.d.slice(0,7)]=(perM[m.d.slice(0,7)]||0)+m.imp);const vals=Object.values(perM),mean=vals.reduce((a,b)=>a+b,0)/vals.length,sd=Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
    const sorted=L.slice().sort((a,b)=>a.d<b.d?-1:1),last=sorted[sorted.length-1],lastM=perM[last.d.slice(0,7)],prevVals=Object.entries(perM).filter(([m])=>m<last.d.slice(0,7)).map(x=>x[1]),prevMed=prevVals.length?prevVals.slice().sort((a,b)=>a-b)[Math.floor(prevVals.length/2)]:lastM;
    out.push({k,cat:last.cat,mens:mean*months.size/ms.length,last:lastM,lastD:last.d,stable:sd/mean<.35,up:prevMed&&lastM>prevMed*1.1?prevMed:null,stopped:diff(last.d,today())>45,n:L.length});});
  return out.sort((a,b)=>b.mens-a.mens);}
const pct=x=>(x>0?"+":"")+Math.round(x*100)+"%";
function cStat(){const S=stats(SP),tot=Object.values(S.per).reduce((a,b)=>a+b,0)||1,sav=S.E-S.U;
  if(!S.A.length)return `<div class="card"><p class="empty">Servono movimenti importati di almeno un mese completo.</p></div>`;
  const sel=`<div class="btns" style="margin:0 0 10px">${[3,6,12,24].map(n=>`<button class="btn sm${n===SP?" pri":""}" data-sp="${n}">${n} mesi</button>`).join("")}</div>`;
  return sel+`<div class="kpi"><div><b class="amt e">${euro(S.E)}</b><span>entrate medie al mese</span></div><div><b class="amt u">${euro(S.U)}</b><span>uscite medie al mese</span></div>
    <div><b class="amt ${sav>=0?"e":"u"}">${euro(sav)}</b><span>avanzo medio al mese</span></div><div><b>${S.E?Math.round(sav/S.E*100):0}%</b><span>quota delle entrate che resta</span></div>
    <div><b class="amt">${euro(S.giro)}</b><span>spostati ogni mese verso altri tuoi conti</span></div></div>
  ${S.giro>50?`<p class="lbl">I soldi spostati verso altri tuoi conti non sono contati come spese: importa anche quei conti per vedere dove finiscono.</p>`:""}
  <h2>Mese per mese</h2><div class="card">${S.A.map(x=>`<div class="row"><div class="grow"><b>${MESE(x.ym)}</b></div><span class="amt e">+${euro(x.e)}</span><span class="amt u">−${euro(x.u)}</span><span class="amt ${x.e-x.u>=0?"e":"u"}" style="min-width:100px;text-align:right">${euro(x.e-x.u)}</span></div>`).join("")}
    <p class="lbl">Mese migliore: ${MESE(S.best.ym)} (${euro(S.best.e-S.best.u)}) · mese più pesante: ${MESE(S.worst.ym)} (${euro(S.worst.e-S.worst.u)})</p></div>
  <h2>Categorie</h2><div class="card">${Object.entries(S.per).sort((a,b)=>b[1]-a[1]).map(([c,v])=>{const tr=S.trend[c];return `<div class="row"><div class="grow"><b>${catName(c)}</b><div style="height:7px;border-radius:5px;background:var(--seg);margin-top:5px"><div style="height:7px;border-radius:5px;width:${Math.round(v/tot*100)}%;background:var(--accent)"></div></div></div><span class="lbl" style="min-width:44px;text-align:right">${Math.round(v/tot*100)}%</span><span class="amt" style="min-width:96px;text-align:right">${euro(v/S.k)}/mese</span><span class="pill ${tr==null?"":tr>.1?"warn":tr<-.1?"ok":""}" title="ultimi 3 mesi rispetto ai 3 precedenti">${tr==null?"—":pct(tr)}</span></div>`;}).join("")}
    <p class="lbl">Percentuale = quota sul totale delle uscite. Etichetta a destra: ultimi 3 mesi rispetto ai 3 precedenti.</p></div>
  <h2>Dove spendi di più</h2><div class="card">${S.merch.map(([k,v])=>`<div class="row"><div class="grow">${esc(k)}</div><span class="amt">${euro(v/S.k)}/mese</span><span class="lbl">${euro(v)} in ${S.k} mesi</span></div>`).join("")}</div>
  <div class="kpi"><div><b>${S.small.n}</b><span>spese sotto 10 € nel periodo</span></div><div><b class="amt">${euro(S.small.tot)}</b><span>totale delle spese piccole</span></div></div>`;}
function cRisp(){const S=stats(12),R=recurring(12),act=R.filter(r=>!r.stopped),fix=act.reduce((s,r)=>s+r.mens,0),varM=Math.max(0,S.U-fix);
  const debts=act.filter(r=>r.cat==="rate"||/cofidis|unicredit|findomestic|agos|compass|prestito|finanz/.test(r.k)),debtM=debts.reduce((s,r)=>s+r.mens,0);
  const cashM=(S.per.contanti||0)/S.k,sav=S.E-S.U,ef=fix*3,ef6=fix*6;
  const ideas=[];
  if(debtM)ideas.push(["📑","Rate e finanziamenti",`Pesano ${euro(debtM)} al mese (${S.E?Math.round(debtM/S.E*100):0}% delle entrate). Quando una rata finisce, sposta la stessa cifra nel risparmio con un bonifico automatico: il bilancio non cambia e il risparmio cresce da solo. Se ne hai più di una, chiudere prima quella col tasso più alto (TAEG) fa pagare meno interessi in tutto.`]);
  act.filter(r=>r.up).forEach(r=>ideas.push(["📈",r.k,`L'ultimo addebito (${euro(r.last)}) è più alto del solito (${euro(r.up)}). Vale la pena controllare se è cambiato il contratto o il premio.`]));
  if(cashM>40)ideas.push(["💵","Prelievi e ricariche",`${euro(cashM)} al mese escono come contanti o ricariche (es. Satispay): da qui non si vede come vengono spesi. Un tetto mensile in Budget aiuta a tenerli d'occhio.`]);
  const contr=act.filter(r=>["casa","auto","abbonamenti"].includes(r.cat));if(contr.length)ideas.push(["🔎","Contratti da rivedere una volta all'anno",`${contr.map(r=>esc(r.k)).join(", ")}: insieme ${euro(contr.reduce((s,r)=>s+r.mens,0))} al mese. Per luce e gas il confronto ufficiale delle offerte è il Portale Offerte di ARERA (ilportaleofferte.it); per assicurazione e telefono conviene chiedere un preventivo prima del rinnovo.`]);
  if(S.small.n>20)ideas.push(["☕","Spese piccole",`${S.small.n} spese sotto 10 € in un anno, per ${euro(S.small.tot)}: prese una per una sembrano niente, sommate fanno ${euro(S.small.tot/12)} al mese.`]);
  ideas.push(["🏦","Pagati per primi",`Il giorno in cui arriva lo stipendio, un bonifico automatico verso un conto separato mette da parte una cifra fissa prima di spendere. Con l'avanzo medio attuale (${euro(sav)} al mese) puoi partire da una parte di quella cifra.`]);
  ideas.push(["🛟","Fondo per le emergenze",`Una regola diffusa è avere da parte 3–6 mesi di spese fisse: per te tra ${euro(ef)} e ${euro(ef6)}. Saldo attuale sui conti: ${euro(totBal())}.`]);
  const cats=Object.entries(S.per).filter(([c])=>!["rate","banca","tasse","contanti"].includes(c)).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return `<div class="kpi"><div><b class="amt">${euro(fix)}</b><span>spese fisse al mese (addebiti che tornano ogni mese)</span></div><div><b class="amt">${euro(varM)}</b><span>spese variabili al mese</span></div><div><b class="amt ${sav>=0?"e":"u"}">${euro(sav)}</b><span>avanzo medio (ultimi 12 mesi)</span></div><div><b class="amt">${euro(sav*12)}</b><span>avanzo in un anno, a questo ritmo</span></div></div>
  ${S.giro>100?`<div class="card" style="border-color:var(--soon)"><b>⚠️ Avanzo da leggere con attenzione</b><p style="margin:4px 0 0">Ogni mese in media ${euro(S.giro)} vanno verso altri tuoi conti (giroconti) e qui non sono contati come spese. Se su quei conti vengono spesi, l'avanzo reale è più basso: importa anche quei conti (es. N26) per avere il quadro completo.</p></div>`:""}
  <h2>Spese fisse trovate</h2><div class="card">${R.length?R.map(r=>`<div class="row"><div class="grow"><b>${esc(r.k)}</b><small>${catName(r.cat)} · ultimo ${fmt(r.lastD,{day:"numeric",month:"short",year:"numeric"})}${r.stopped?" · <b>sembra terminato</b>":""}${r.up?' · <b style="color:var(--warn)">aumentato</b>':""}</small></div><span class="amt u">${euro(r.mens)}/mese</span><span class="lbl">${euro(r.mens*12)}/anno</span></div>`).join(""):'<p class="empty">Servono almeno 3 mesi di movimenti.</p>'}</div>
  <h2>💡 Dove si può risparmiare</h2>${ideas.map(([i,t,x])=>`<div class="card"><h3>${i} ${esc(t)}</h3><p style="margin:0">${x}</p></div>`).join("")}
  <h2>🎚️ Prova a ridurre</h2><div class="card"><p class="lbl">Sposta i cursori: vedi quanto risparmieresti al mese e in un anno, e in quanto tempo arrivi a un obiettivo.</p>
    ${cats.map(([c,v])=>`<div class="row"><div class="grow"><b>${catName(c)}</b><small>${euro(v/S.k)} al mese</small></div><input type="range" min="0" max="50" step="5" value="0" data-cut="${c}" data-v="${(v/S.k).toFixed(2)}" style="width:160px"><span class="lbl" data-cutl="${c}" style="min-width:44px">0%</span></div>`).join("")}

/* ---- scrittura nelle Licenze (stessa memoria della sezione Licenze: browser + database del dispositivo) ---- */
function licWrite(fn){const s=lsJ(LKEY);if(!s)return false;s.days=s.days||{};fn(s);s.savedAt=new Date().toISOString();const t=JSON.stringify(s);
  try{localStorage.setItem(LKEY,t);}catch(e){return false;}kv("readwrite","stato",t).catch(()=>{});return true;}
function licEditable(S,s){const st=S.start||PROV_START;return s>=st&&s<=S.end&&kind(s)==="LAV"&&s!==S.end;}
function licSetCode(s,c){return licWrite(S=>{const d=S.days[s]||{},from=d.c||"P";if(from===c)return;if(c==="P")delete d.c;else d.c=c;
  if(Object.keys(d).length)S.days[s]=d;else delete S.days[s];S.log=(S.log||[]);S.log.push({t:new Date().toISOString(),s,from,to:c});if(S.log.length>60)S.log=S.log.slice(-60);});}
function licSetField(s,k,v){return licWrite(S=>{const d=S.days[s]||{};if(v)d[k]=v;else delete d[k];if(Object.keys(d).length)S.days[s]=d;else delete S.days[s];});}
function licOver(S){ // giorni di licenza oltre i saldi (stesso ordine di consumo della sezione Licenze)
  const st=S.start||PROV_START,b=Object.assign({},S.bal);let over=0;
  for(let s=st;s<=S.end;s=add(s,1)){if(kind(s)!=="LAV")continue;const c=(S.days[s]&&S.days[s].c)||"P",y27=s>="2027-01-01";
    if(c==="LP"){if(b.lo25>0)b.lo25--;else if(y27&&b.lo26>0)b.lo26--;else over++;}
    else if(c==="LO"){if(!y27){if(b.lo26>0)b.lo26--;else over++;}else if(b.lo27>0)b.lo27--;else over++;}
    else if(c==="RL"){if(b.rl26>0)b.rl26--;else if(y27&&b.rl27>0)b.rl27--;else over++;}}
  return over;}

function valeCal(){const p=lsJ("prog-vale-v1"),inb=lsJ(VIN),d=p?((p.state&&p.state.data)||p.data||{}):{};
  const days=new Set([].concat(Array.isArray(d.days)?d.days:[],inb&&Array.isArray(inb.days)?inb.days:[]).map(x=>{const m=String(x).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);return m?m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0"):String(x);}));
  return{days,diary:d.diary&&typeof d.diary==="object"?d.diary:{}};}
const VMOOD={felice:["😄","felice"],serena:["😊","serena"],orgogliosa:["🤩","orgogliosa"],carica:["💪","carica"],cosi:["😐","così così"],stanca:["😴","stanca"],triste:["😢","triste"],arrabbiata:["😠","arrabbiata"],preoccupata:["😟","preoccupata"]};
const VDOWN=new Set(["triste","arrabbiata","preoccupata"]);

/* ---- tutto quello che c'è in un giorno ---- */
function scadOn(s){const out=[];scadOpen().forEach(x=>{let d=x.d,g=0;while(d&&d<s&&g++<400){d=nextDate(d,x.ric);}if(d===s)out.push({x,proj:d!==x.d});});return out;}
function tcOn(s){return tcSessions().filter(x=>x.d===s);}
function dayData(s,V){
  const S=licS(),L=S?licDay(S,s):{k:kind(s),c:null,t:""},it=[];
  if(S&&S.ev&&S.ev[s])it.push({ic:"📅",t:S.ev[s],c:"lic",k:"licev"});
  if(S&&s===S.end)it.push({ic:"🎉",t:"Congedo",c:"lic",k:"congedo"});
  if(HOL[s])it.push({ic:"🇮🇹",t:HOL[s],c:"hol",k:"hol"});
  scadOn(s).forEach(o=>it.push({ic:(CAT[o.x.cat]||CAT.altro)[0],t:o.x.t,c:o.proj?"scad proj":scadState(o.x)==="warn"?"scad warn":"scad",k:"scad",id:o.x.id,proj:o.proj,sub:RIC[o.x.ric]&&o.x.ric!=="no"?RIC[o.x.ric]:""}));
  try{C().ric.forEach(r=>{if(ricDates(r,s,s).length)it.push({ic:r.tipo==="e"?"💰":"💶",t:r.t,amt:(r.tipo==="e"?"+":"−")+euro(r.imp),c:"pay"+(r.tipo==="e"?" in":""),k:"pay",id:r.id});});}catch(e){}
  famOn(s).forEach(a=>it.push({ic:"👨‍👧",t:(a.chi?a.chi+": ":"")+a.t,o:a.o||"",f:a.f||"",c:"fam",k:a.tipo==="att"?"att":"fev",id:a.id,sub:[a.tipo==="att"?(+a.ogni===2?"ogni 2 settimane":"ogni settimana"):"",a.acc?"🚗 "+a.acc:""].filter(Boolean).join(" · ")}));
  if(typeof pratOn==="function")pratOn(s).forEach(x=>it.push({ic:"🗂️",t:x.passo.t,c:"prat",k:"prat",id:x.id,sub:x.t}));
  calOn(s).forEach(e=>it.push({ic:calIc(e),t:e.t,o:e.o||"",f:e.f||"",c:"ipad",k:"ipad",sub:[e.cal,e.loc].filter(Boolean).join(" · ")}));
  const dn=(P.dn||{})[s];
  it.sort((a,b)=>(a.o||"99")<(b.o||"99")?-1:(a.o||"99")>(b.o||"99")?1:0);
  const V2=V||valeCal(),vd=V2.diary[s];
  return{S,L,it,dn,ben:benDay(s),tc:tcOn(s),vstudy:V2.days.has(s),vmood:vd&&typeof vd==="object"&&VMOOD[vd.m]?vd:null};
}
const offDay=L=>L&&(L.k!=="LAV"||(L.c&&L.c!=="P"&&L.c!=="OUT"));

    if(a==="save:pay"){const t=$("caT").value.trim(),i=parseFloat(String($("caI").value).replace(/\./g,"").replace(",","."));if(!t||!(i>0))return toast("Scrivi voce e importo");
      const f=$("caF").value,one=f==="1";C().ric.push({id:uid(),t,imp:Math.round(i*100)/100,tipo:$("caTp").value,kind:"",freq:one?"m":f,d0:s,fine:one?s:($("caE").value||""),cat:"altro"});calAdd="";save();R();return toast("💶 Pagamento aggiunto in Conti");}
    if(a==="save:fam"){const t=$("caT").value.trim();if(!t)return toast("Scrivi che cosa");const o={t,chi:$("caC2").value.trim(),o:$("caO").value,f:$("caF2").value,acc:$("caAc").value.trim()},rp=$("caRp").value,fi=$("caFi").value;
      if(calEdit){const L=calEdit.k==="att"?P.fam.att:P.fam.ev,E=L.find(x=>x.id===calEdit.id);if(E){Object.assign(E,o);if(calEdit.k==="att"){E.ogni=rp==="2"?2:1;E.fino=fi||"";}}calEdit=null;calAdd="";save();R();return toast("Modificato");}
      if(rp==="0")P.fam.ev.push(Object.assign({id:uid(),d:s},o));else P.fam.att.push(Object.assign({id:uid(),g:(parse(s).getDay()+6)%7+1,dal:s,ogni:rp==="2"?2:1,fino:fi||"",pause:[]},o));
      calAdd="";save();R();return toast(rp==="0"?"👨‍👧 Impegno aggiunto":"👨‍👧 Attività fissa aggiunta");}
    if(a.startsWith("fedit:")){const[,k,id]=a.split(":");calEdit={k,id};calAdd="fam";return R();}
    if(a==="fcancel"){calEdit=null;calAdd="";return R();}
    if(a==="fskip"&&calEdit){const E=P.fam.att.find(x=>x.id===calEdit.id);if(E){(E.pause=E.pause||[]).push({da:s,a:s});}calEdit=null;calAdd="";save();R();return toast("Tolta solo per questo giorno");}
    if(a==="fdel"&&calEdit){if(!confirm(calEdit.k==="att"?"Togliere questa attività da tutte le settimane?":"Togliere questo impegno?"))return;if(calEdit.k==="att")P.fam.att=P.fam.att.filter(x=>x.id!==calEdit.id);else P.fam.ev=P.fam.ev.filter(x=>x.id!==calEdit.id);calEdit=null;calAdd="";save();R();return toast("Tolto");}
    if(a==="fixed"){calFixed=true;R();return window.scrollTo(0,0);}

  document.querySelectorAll("[data-tc]").forEach(b=>b.onclick=()=>{const s=calV==="giorno"?calD:calSel,k=b.dataset.tc,m=lsJ("tc_sessions")||{};

    try{localStorage.setItem("tc_sessions",JSON.stringify(m));}catch(e){}R();});
  document.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{const[tp,id]=b.dataset.cdel.split(":");if(tp==="fev"){if(!confirm("Togliere questo impegno?"))return;P.fam.ev=P.fam.ev.filter(a=>a.id!==id);save();R();}});
}

function bindFixed(){
  document.querySelectorAll("[data-fx]").forEach(b=>b.onclick=()=>{const[k,id]=b.dataset.fx.split(":"),a=P.fam.att.find(x=>x.id===id);if(!a)return;

/* ---------- 🗂️ PRATICHE: le cose lunghe in corso ----------
   Per ogni pratica: stato, prossimo passo con data (compare nel Calendario e nelle Scadenze), documenti da spuntare,
   uffici e contatti, diario delle cose fatte, file allegati e note. Tutto resta su questo dispositivo (pn-v1);
   i file allegati stanno nel database del dispositivo («licenze-marco», chiavi «pf-…») e non entrano nella copia su iCloud. */
const PRAT_ST={corso:["In corso","soon"],attesa:["In attesa di risposta","fam"],chiusa:["Chiusa","ok"]};
const PRAT_MOD={
  congedo:["🎖️","Congedo / pensione",["Domanda e ricevuta di invio","Documenti richiesti dall’ufficio","Comunicazioni ricevute","Prospetto economico"]],
  auto:["🚗","Auto",["Contratto in corso","Proposta di riscatto","Preventivo di un nuovo contratto","Verbale di riconsegna","Libretto e assicurazione"]],
  casa:["🏠","Casa in affitto",["Contratto di locazione","Registrazione del contratto","Ricevute dei canoni","Foto e inventario della casa","Documento dell’inquilino"]],
  legale:["⚖️","Pratica legale o amministrativa",["Atto o comunicazione ricevuta","Risposta inviata (con ricevuta)","Documenti a supporto","Termini da rispettare"]],
  altro:["📁","Altro",[]]};
let pratSel=null, pratNew=false, pratEditPasso=false;
const PR=()=>{if(!Array.isArray(P.prat))P.prat=[];return P.prat;};
const pratById=id=>PR().find(x=>x.id===id);
const pratIc=x=>(PRAT_MOD[x.mod]||PRAT_MOD.altro)[0];
function pratOn(s){return PR().filter(x=>x.stato!=="chiusa"&&x.passo&&x.passo.d===s);}
function pratDue(days){const t=today();return PR().filter(x=>x.stato!=="chiusa"&&x.passo&&x.passo.d&&diff(t,x.passo.d)<=days).sort((a,b)=>a.passo.d<b.passo.d?-1:1);}
function pratRow(x){const p=x.passo,st=PRAT_ST[x.stato]||PRAT_ST.corso,dn=(x.docs||[]).filter(d=>d.ok).length,dt=(x.docs||[]).length;
  const late=p&&p.d&&p.d<today()&&x.stato!=="chiusa";
  return `<button class="prow" data-psel="${x.id}"><span class="pic">${pratIc(x)}</span><span class="grow"><b>${esc(x.t)}</b><small>${p&&p.t?`➡️ ${esc(p.t)}${p.d?" · "+fmt(p.d,{weekday:"short",day:"numeric",month:"short"})+" ("+rel(p.d)+")":""}`:"Nessun prossimo passo"}${dt?` · 📄 ${dn}/${dt}`:""}</small></span><span class="pill ${late?"warn":st[1]}">${late?"in ritardo":st[0]}</span></button>`;}
function vPrat(){
  if(pratSel&&pratById(pratSel))return pratDetail(pratById(pratSel));
  const L=PR(),open=L.filter(x=>x.stato!=="chiusa").sort((a,b)=>((a.passo&&a.passo.d)||"9")<((b.passo&&b.passo.d)||"9")?-1:1),closed=L.filter(x=>x.stato==="chiusa");
  let o=`<h1>🗂️ Pratiche</h1><p class="sub">Le cose lunghe in corso: a che punto sono, qual è il prossimo passo, che cosa manca. Il prossimo passo compare da solo nel Calendario e nelle Scadenze.</p>`;
  o+=`<div class="btns" style="margin:0 0 12px"><button class="btn pri" data-pa="new">➕ Nuova pratica</button></div>`;
  if(pratNew)o+=`<div class="card"><h3>➕ Nuova pratica</h3><div class="form"><label class="wide">Nome<input id="pnT" maxlength="80" placeholder="es. noleggio auto, affitto appartamento, domanda di congedo"></label>

    <div class="btns"><button class="btn pri" data-pa="create">Crea</button><button class="btn" data-pa="cancel">Annulla</button></div></div>`;
  o+=open.length?`<div class="card plist">${open.map(pratRow).join("")}</div>`:(pratNew?"":`<div class="card"><p class="empty">Nessuna pratica aperta. Creane una con «➕ Nuova pratica».</p></div>`);
  if(closed.length)o+=`<details class="more"><summary>Chiuse (${closed.length})</summary><div class="card plist">${closed.map(pratRow).join("")}</div></details>`;
  return o;

function pratDetail(x){
  const p=x.passo||{},st=x.stato||"corso",docs=x.docs||[],cont=x.cont||[],log=(x.log||[]).slice().sort((a,b)=>a.d<b.d?1:-1),files=x.files||[];

  <div class="card"><div class="form"><label class="wide">Nome<input data-pf="t" maxlength="80" value="${esc(x.t)}"></label>
    <label>Stato<select data-pf="stato">${Object.entries(PRAT_ST).map(([k,v])=>`<option value="${k}"${st===k?" selected":""}>${v[0]}</option>`).join("")}</select></label>
    <label>Tipo<select data-pf="mod">${Object.entries(PRAT_MOD).map(([k,v])=>`<option value="${k}"${(x.mod||"altro")===k?" selected":""}>${v[0]} ${v[1]}</option>`).join("")}</select></label></div></div>
  <div class="card"><h3>➡️ Prossimo passo</h3>${p.t&&!pratEditPasso?`<div class="row"><div class="grow"><b>${esc(p.t)}</b><small>${p.d?fmt(p.d,{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · "+rel(p.d):"senza data"}</small></div><button class="btn ok sm" data-pa="passodone">✓ Fatto</button><button class="btn sm" data-pa="passoedit">Modifica</button></div>`

/* attività fisse: ogni settimana o ogni 2 settimane (da «dal»), fino a «fino», con periodi di pausa; impegni di un giorno */
function attOn(a,s){const g=(parse(s).getDay()+6)%7+1;if(+a.g!==g)return false;if(a.dal&&s<a.dal)return false;if(a.fino&&s>a.fino)return false;
  if((a.pause||[]).some(p=>s>=p.da&&s<=(p.a||p.da)))return false;if(+a.ogni===2&&a.dal&&Math.round(diff(monday(a.dal),monday(s))/7)%2)return false;return true;}
function famOn(s){return P.fam.att.filter(a=>attOn(a,s)).map(a=>Object.assign({tipo:"att"},a)).concat(P.fam.ev.filter(e=>e.d===s).map(e=>Object.assign({tipo:"ev"},e))).sort((a,b)=>(a.o||"")<(b.o||"")?-1:1);}

/* ---------- eventi dal Calendario dell'iPad (tramite il Comando Rapido «Aggiorna Pianificazione») ----------
   Il Comando Rapido copia negli appunti una riga per evento: inizio§fine§titolo§calendario§tutto il giorno§luogo
   (date in ISO 8601). Qui si incollano: sostituiscono la copia precedente, senza doppioni. */
const SC_NAME="Aggiorna Pianificazione";
/* date come le scrive Comandi Rapidi: ISO 8601, «05/10/26, 09:50», «5 ott 2026 alle ore 09:50», «5 ottobre 2026, 9:50», «Oct 5, 2026 at 9:50 AM» */
const MESI_IT=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"],MESI_EN=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseWhen(x){
  x=String(x||"").trim().toLowerCase();if(!x)return null;
  let m=x.match(/^(\d{4})-(\d{2})-(\d{2})(?:[t ](\d{2}):(\d{2}))?/);
  if(m)return{d:m[1]+"-"+m[2]+"-"+m[3],t:m[4]?m[4]+":"+m[5]:""};
  const tm=(x.match(/(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?\s*$/)||x.match(/(?:alle|ore|at|,)\s*(?:ore\s*)?(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?/));
  let t="";if(tm){let h=+tm[1];if(tm[3]==="p"&&h<12)h+=12;if(tm[3]==="a"&&h===12)h=0;t=pad(h)+":"+tm[2];}
  const Y=y=>{y=+y;return y<100?2000+y:y;};
  m=x.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(m)return{d:Y(m[3])+"-"+pad(+m[2])+"-"+pad(+m[1]),t};
  m=x.match(/^(\d{1,2})\s+([a-zà-ù]{3,})\.?\s+(\d{4})/);
  if(m){const k=MESI_IT.indexOf(m[2].slice(0,3));if(k>=0)return{d:m[3]+"-"+pad(k+1)+"-"+pad(+m[1]),t};}
  m=x.match(/^([a-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/);
  if(m){const k=MESI_EN.indexOf(m[1].slice(0,3));if(k>=0)return{d:m[3]+"-"+pad(k+1)+"-"+pad(+m[2]),t};}
  return null;
}
function parseCal(txt){
  const out=[],seen=new Set();
  String(txt||"").split(/\r?\n/).forEach(l=>{const f=l.split("§").map(z=>z.trim());if(f.length<2)return;
    // formati accettati: inizio§fine§titolo§calendario§luogo  (anche: inizio§titolo§calendario, e la vecchia riga con «tutto il giorno»)
    let S=parseWhen(f[0]),E=parseWhen(f[1]),t,cal,loc,adf=null;
    if(E){t=f[2]||"";cal=f[3]||"";if(/^(s[iì]|no|yes|true|false|1|0|vero|falso)$/i.test(f[4]||"")){adf=/^(s[iì]|yes|true|1|vero)$/i.test(f[4]);loc=f[5]||"";}else loc=f[4]||"";}
    else{t=f[1]||"";cal=f[2]||"";loc=f[3]||"";E=S;}
    if(!S||!t)return;
    if(/festivit|holiday/i.test(cal))return; // le festività le conosce già l'app
    const ad=adf!=null?adf:(!S.t||S.t==="00:00")&&(!E.t||E.t==="00:00"||E.t==="23:59");
    const k=S.d+"T"+(S.t||"")+"|"+t;if(seen.has(k))return;seen.add(k);
    let ed=E.d||S.d;if(ad&&E.t==="00:00"&&ed>S.d)ed=add(ed,-1);
    out.push({k,d:S.d,o:ad?"":S.t,f:ad||E.d!==S.d?"":E.t,ed,t,cal,ad,loc:loc.split("\n")[0]});});
  return out.sort((a,b)=>(a.d+(a.o||""))<(b.d+(b.o||""))?-1:1);
}
function importCal(txt){const ev=parseCal(txt);if(!ev.length){toast("Negli appunti non ci sono eventi del Comando Rapido");return false;}
  P.cal={at:new Date().toISOString(),ev};P.cal.wait=false;save();render();toast("📆 "+ev.length+" eventi dal Calendario");return true;}
async function pasteCal(){try{const t=await navigator.clipboard.readText();importCal(t);}catch(e){toast("Non riesco a leggere gli appunti: incolla nel riquadro");go("cal");setTimeout(()=>{const a=$("calPaste");if(a)a.focus();},200);}}
function runShortcut(){P.cal.wait=true;save();location.href="shortcuts://run-shortcut?name="+encodeURIComponent(SC_NAME);}
function calOn(s){return (P.cal.ev||[]).filter(e=>e.d<=s&&(e.ed||e.d)>=s);}
const calIc=e=>/compleann|🎂/i.test(e.t+" "+e.cal)?"🎂":/lavoro/i.test(e.cal)?"💼":"📆";
function calCard(){const t=today(),up=(P.cal.ev||[]).filter(e=>e.d>=t&&diff(t,e.d)<=7);

    ${P.cal.wait?'<div class="btns" style="margin:0 0 8px"><button class="btn pri" id="calPasteBtn">📥 Tocca qui per inserire gli eventi</button></div>':""}
    ${up.length?up.slice(0,7).map(e=>`<div class="row"><span class="pill ${e.d===t?"soon":""}">${e.d===t?"oggi":fmt(e.d,{weekday:"short",day:"numeric"})}${e.o?" "+esc(e.o):""}</span><div class="grow"><b>${calIc(e)} ${esc(e.t)}</b>${e.loc?`<small>${esc(e.loc)}</small>`:""}</div></div>`).join(""):`<p class="empty">${P.cal.at?"Niente nei prossimi 7 giorni.":"Ancora nessun evento: crea il Comando Rapido (vedi «Come funziona»)."}</p>`}
    <div class="btns"><button class="btn sm" id="calRun">🔄 Aggiorna dal Calendario</button><button class="btn sm" id="calClip">📥 Incolla dagli appunti</button></div>
    ${P.cal.at?`<p class="lbl">Aggiornato ${rel(P.cal.at.slice(0,10))} alle ${new Date(P.cal.at).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}</p>`:""}</div>`;}

/* ---------- calendario (.ics) ---------- */
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");}
function fold(l){ // righe al massimo di 75 byte (UTF-8), senza spezzare i caratteri
  const enc=new TextEncoder(),out=[];let cur="",n=0;for(const ch of l){const b=enc.encode(ch).length;if(n+b>(out.length?73:74)){out.push(cur);cur=" ";n=1;}cur+=ch;n+=b;}out.push(cur);return out.join("\r\n");}
const dval=s=>s.replace(/-/g,"");
const stamp=()=>new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
function alarm(days){if(days==null||days==="")return[];const n=+days;return["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Promemoria",n<=0?"TRIGGER:PT9H":"TRIGGER:-P"+(n-1)+"DT15H","END:VALARM"];}
function icsItems(opt){
  const S=licS(),items=[],t=today(),horizon=add(t,400);
  if(opt.abs&&S)absBlocks(S).forEach(b=>{const c=Object.entries(b.codes).map(([k,v])=>v+" "+k).join(" · ");
    items.push({uid:"abs-"+b.from+"-"+b.to,lines:["DTSTART;VALUE=DATE:"+dval(b.from),"DTEND;VALUE=DATE:"+dval(add(b.to,1)),"SUMMARY:"+icsEsc("🏖️ A casa ("+c+")"),"TRANSP:TRANSPARENT"]});});
  if(opt.app&&S)Object.keys(S.ev||{}).filter(d=>d>=t).forEach(d=>items.push({uid:"app-"+d,lines:["DTSTART;VALUE=DATE:"+dval(d),"DTEND;VALUE=DATE:"+dval(add(d,1)),"SUMMARY:"+icsEsc("📅 "+S.ev[d]),...alarm(1)]}));
  if(opt.app&&S&&S.end)items.push({uid:"congedo-"+S.end,lines:["DTSTART;VALUE=DATE:"+dval(S.end),"DTEND;VALUE=DATE:"+dval(add(S.end,1)),"SUMMARY:"+icsEsc("🎉 Congedo"),...alarm(7)]});
  if(opt.scad)scadOpen().filter(x=>!x.fromCal).forEach(x=>{ /* quelle prese dal Calendario ci sono già */const c=CAT[x.cat]||CAT.altro,l=["DTSTART;VALUE=DATE:"+dval(x.d),"DTEND;VALUE=DATE:"+dval(add(x.d,1)),"SUMMARY:"+icsEsc(c[0]+" "+x.t)];
    if(x.note)l.push("DESCRIPTION:"+icsEsc(x.note));if(x.ric==="m")l.push("RRULE:FREQ=MONTHLY");if(x.ric==="a")l.push("RRULE:FREQ=YEARLY");items.push({uid:"scad-"+x.id,lines:l.concat(alarm(x.av))});});
  if(opt.pay)P.conti.ric.filter(r=>r.tipo!=="e").forEach(r=>{const d=ricDates(r,t,horizon)[0];if(!d)return;const step=(FREQ[r.freq]||FREQ.m)[1];
    items.push({uid:"pay-"+r.id,lines:["DTSTART;VALUE=DATE:"+dval(d),"DTEND;VALUE=DATE:"+dval(add(d,1)),"SUMMARY:"+icsEsc("💶 "+r.t),"RRULE:FREQ=MONTHLY;INTERVAL="+step+(r.fine?";UNTIL="+dval(r.fine):""),...alarm(2)]});});
  if(opt.fam){const BY=["MO","TU","WE","TH","FR","SA","SU"];P.fam.att.forEach(a=>{if(a.fino&&a.fino<t)return;let d=a.dal&&a.dal>t?a.dal:t,g=0;while(!attOn(a,d)&&g++<30)d=add(d,1);if(!attOn(a,d))return;
      const tm=x=>(x||"00:00").replace(":","")+"00",ex=[];(a.pause||[]).forEach(p=>{for(let x=p.da;x<=(p.a||p.da)&&ex.length<120;x=add(x,1))if(((parse(x).getDay()+6)%7+1)===+a.g&&x>=d)ex.push(dval(x)+"T"+tm(a.o||"16:00"));});
      items.push({uid:"fam-"+a.id,lines:["DTSTART:"+dval(d)+"T"+tm(a.o||"16:00"),"DTEND:"+dval(d)+"T"+tm(a.f||a.o||"17:00"),"SUMMARY:"+icsEsc("👨‍👧 "+(a.chi?a.chi+": ":"")+a.t),"RRULE:FREQ=WEEKLY;BYDAY="+BY[a.g-1]+(+a.ogni===2?";INTERVAL=2":"")+(a.fino?";UNTIL="+dval(a.fino)+"T235959":""),...(ex.length?["EXDATE:"+ex.join(",")]:[]),...(a.acc?["DESCRIPTION:"+icsEsc("Accompagna: "+a.acc)]:[])]});});
    P.fam.ev.filter(e=>e.d>=t).forEach(e=>{const tm=x=>(x||"00:00").replace(":","")+"00";items.push({uid:"fev-"+e.id,lines:e.o?["DTSTART:"+dval(e.d)+"T"+tm(e.o),"DTEND:"+dval(e.d)+"T"+tm(e.f||e.o),"SUMMARY:"+icsEsc("👨‍👧 "+e.t),...alarm(1)]:["DTSTART;VALUE=DATE:"+dval(e.d),"DTEND;VALUE=DATE:"+dval(add(e.d,1)),"SUMMARY:"+icsEsc("👨‍👧 "+e.t),...alarm(1)]});});}
  if(opt.prat!==false&&typeof PR==="function")PR().filter(x=>x.stato!=="chiusa"&&x.passo&&x.passo.d&&x.passo.d>=t).forEach(x=>items.push({uid:"prat-"+x.id,lines:["DTSTART;VALUE=DATE:"+dval(x.passo.d),"DTEND;VALUE=DATE:"+dval(add(x.passo.d,1)),"SUMMARY:"+icsEsc("🗂️ "+x.passo.t+" («"+x.t+"»)"),...alarm(2)]}));
  items.forEach(i=>i.sig=i.lines.join("|"));
  return items;
}
function icsText(items){const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Pianificazione//IT","CALSCALE:GREGORIAN","X-WR-CALNAME:Pianificazione"],ds=stamp();
  items.forEach(i=>{L.push("BEGIN:VEVENT","UID:"+i.uid+"@pianificazione","DTSTAMP:"+ds,...i.lines,"END:VEVENT");});L.push("END:VCALENDAR");return L.map(fold).join("\r\n")+"\r\n";}

let editId=null;
function side(){const late=scadOpen().filter(x=>scadState(x)==="warn").length;

  // benessere
  const bd=benDay(t),tc=tcSessions(),tcToday=tc.filter(x=>x.d===t).length,tcWeek=tc.filter(x=>x.d>=monday(t)).length;

  o+=weekCard();
  return o+"</div>";
}
function vScad(){
  const x=editId?P.scad.find(y=>y.id===editId):null,L=scadOpen(),t=today();
  const groups=[["Scadute",L.filter(y=>y.d<t)],["Prossimi 7 giorni",L.filter(y=>y.d>=t&&diff(t,y.d)<=7)],["Prossimi 30 giorni",L.filter(y=>diff(t,y.d)>7&&diff(t,y.d)<=30)],["Più avanti",L.filter(y=>diff(t,y.d)>30)]];
  let o=`<h1>📌 Scadenze e pratiche</h1><p class="sub">Pratiche, documenti, auto, casa, pagamenti: tutto con una data e un promemoria. Le ricorrenti, quando le segni fatte, passano da sole alla data successiva.</p>

    <label>Data<input id="sD" type="date" value="${x?x.d:""}"></label>
    <label>Categoria<select id="sC">${Object.entries(CAT).map(([k,v])=>`<option value="${k}"${x&&x.cat===k?" selected":""}>${v[0]} ${v[1]}</option>`).join("")}</select></label>
    <label>Si ripete<select id="sR">${Object.entries(RIC).map(([k,v])=>`<option value="${k}"${x&&x.ric===k?" selected":""}>${v}</option>`).join("")}</select></label>
    <label>Avvisami<select id="sA">${[[0,"il giorno stesso"],[1,"1 giorno prima"],[3,"3 giorni prima"],[7,"1 settimana prima"],[14,"2 settimane prima"],[30,"1 mese prima"]].map(([k,v])=>`<option value="${k}"${(x?+x.av:7)===k?" selected":""}>${v}</option>`).join("")}</select></label>
    <label class="wide">Note (facoltative)<input id="sN" maxlength="300" placeholder="ufficio, numero di pratica, documenti da portare…" value="${esc(x?x.note||"":"")}"></label>
  </div><div class="btns"><button class="btn pri" id="sSave">${x?"Salva modifiche":"Aggiungi"}</button>${x?'<button class="btn" id="sCancel">Annulla</button><button class="btn danger" id="sDel">Elimina</button>':""}</div></div>`;

  if(!L.length)o+=`<div class="card"><p class="empty">Nessuna scadenza aperta. Aggiungi la prima qui sopra.</p></div>`;
  const ce=(P.cal.ev||[]).filter(e=>e.d>=t&&diff(t,e.d)<=30&&calIc(e)!=="🎂");
  if(ce.length)o+=`<h2>📆 Dal Calendario (prossimi 30 giorni)</h2><div class="card">${ce.map(e=>`<div class="row"><span class="pill">${fmt(e.d,{weekday:"short",day:"numeric",month:"short"})}${e.o?" "+esc(e.o):""}</span><div class="grow"><b>${calIc(e)} ${esc(e.t)}</b><small>${esc(e.cal)}${e.loc?" · "+esc(e.loc):""} · ${rel(e.d)}</small></div><button class="btn sm" data-c2s="${esc(e.k)}">➕ Scadenza</button></div>`).join("")}</div>`;
  const pp=typeof pratDue==="function"?pratDue(60):[];
  if(pp.length)o+=`<h2>🗂️ Prossimi passi delle pratiche</h2><div class="card">${pp.map(x=>`<div class="row"><span class="pill ${x.passo.d<t?"warn":diff(t,x.passo.d)<=7?"soon":""}">${fmt(x.passo.d,{day:"numeric",month:"short"})}</span><div class="grow"><b>${pratIc(x)} ${esc(x.passo.t)}</b><small>${esc(x.t)} · ${rel(x.passo.d)}</small></div><button class="btn sm" data-psel="${x.id}">Apri</button></div>`).join("")}</div>`;
  const done=P.scad.filter(y=>y.done).sort((a,b)=>a.doneAt<b.doneAt?1:-1).slice(0,10);
  if(done.length)o+=`<h2>Fatte</h2><div class="card">${done.map(y=>`<div class="row"><button class="chk done" data-undo="${y.id}" aria-label="Riapri">✓</button><div class="grow"><b>${esc(y.t)}</b><small>fatta il ${fmt(y.doneAt)}</small></div></div>`).join("")}</div>`;
  return o;
}

function vBen(){
  const t=today(),bd=benDay(t),tc=tcSessions(),days=[...Array(14)].map((_,i)=>add(t,i-13));
  const W=600,H=150,x=i=>20+i*(W-40)/13,y=(v,max)=>H-20-(v/max)*(H-40);
  const pts=(k,max)=>days.map((s,i)=>{const v=+(benDay(s)[k]||0);return v?[x(i),y(v,max)]:null;});
  const line=(p,c)=>{const q=p.filter(Boolean);return q.length?`<polyline fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" points="${q.map(a=>a.join(",")).join(" ")}"/>`+q.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="4" fill="${c}"/>`).join(""):"";};
  const weeks=[3,2,1,0].map(k=>{const m=add(monday(t),-7*k);return{m,n:tc.filter(s=>s.d>=m&&s.d<add(m,7)).length};});
  return `<h1>🧘 Benessere</h1><p class="sub">Un minuto al giorno: come stai, quanto hai dormito, quanto ti sei mosso. Il Tai Chi si conta da solo.</p>
  <div class="card"><h3>Oggi · ${fmt(t,{weekday:"long",day:"numeric",month:"long"})}</h3>
    <div class="lbl">Umore</div><div class="mood" style="margin:6px 0 10px">${UMORE.map((u,i)=>`<button data-mood="${i+1}" class="${+bd.umore===i+1?"on":""}" aria-label="umore ${i+1}">${u}</button>`).join("")}</div>
    <div class="form"><label>Ore di sonno<input id="bS" type="text" inputmode="decimal" placeholder="es. 7,5" value="${bd.sonno||""}"></label>
    <label>Passi<input id="bP" type="number" inputmode="numeric" step="100" min="0" value="${bd.passi||""}"></label>
    <label>Energia (1–5)<select id="bE"><option value="">—</option>${[1,2,3,4,5].map(n=>`<option${+bd.energia===n?" selected":""}>${n}</option>`).join("")}</select></label>
    <label class="wide">Nota<input id="bN" maxlength="200" value="${esc(bd.note||"")}" placeholder="facoltativa"></label></div></div>
  <h2>Ultime 2 settimane</h2><div class="card"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Umore e sonno delle ultime due settimane">
    <line x1="20" x2="${W-20}" y1="${H-20}" y2="${H-20}" stroke="var(--line)"/>${line(pts("umore",5),"#1f5fae")}${line(pts("sonno",10),"#2e7d5b")}
    ${days.map((s,i)=>i%2?"":`<text x="${x(i)}" y="${H-4}" font-size="11" text-anchor="middle" fill="var(--muted)">${parse(s).getDate()}</text>`).join("")}</svg>
    <div class="lbl"><span style="color:#1f5fae">●</span> umore (1–5) · <span style="color:#2e7d5b">●</span> ore di sonno</div></div>
  <h2>Tai Chi</h2><div class="kpi">${weeks.map(w=>`<div><b>${w.n}</b><span>sessioni, settimana del ${fmt(w.m,{day:"numeric",month:"short"})}</span></div>`).join("")}</div>
  <div class="btns"><a class="btn pri" href="taichi.html" style="text-decoration:none">🧘 Apri il Tai Chi</a></div>`;
}

  if(cur==="cal"&&typeof bindCal==="function")bindCal();
  if(typeof bindConti==="function"&&cur==="conti")bindConti();
  if($("lkAv")&&window.__pnLock)window.__pnLock.available().then(ok=>{const e=$("lkAv");if(e)e.textContent=ok?"✓ Questo iPad può usare Face ID (o il suo codice).":"⚠️ Qui Face ID non è disponibile per le app web: puoi usare solo il codice di riserva.";});
  if($("lkOn"))$("lkOn").onclick=async()=>{const a=$("lkP1").value.trim(),b=$("lkP2").value.trim();if(!/^\d{4,8}$/.test(a)){toast("Il codice deve avere da 4 a 8 cifre");return;}if(a!==b){toast("I due codici non coincidono");return;}
    try{await window.__pnLock.enable(a);toast("🔒 Blocco attivato");render();}catch(e){toast(e&&e.name==="NotAllowedError"?"Face ID annullato":"Non riuscito: "+(e&&e.message||e));}};
  if($("lkOff"))$("lkOff").onclick=()=>{if(!confirm("Disattivare il blocco con Face ID?"))return;window.__pnLock.disable();render();toast("Blocco disattivato");};
  if($("lkNow"))$("lkNow").onclick=()=>window.__pnLock.lockNow();
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{if(b.dataset.s==="prat")pratSel=null;if(b.dataset.s==="cal"){calFixed=false;calLink=false;}go(b.dataset.s);});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>doneScad(b.dataset.done));
  document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{const x=P.scad.find(y=>y.id===b.dataset.undo);if(x){x.done=false;delete x.doneAt;save();render();}});
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editId=b.dataset.edit;render();window.scrollTo(0,0);});
  document.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>{setBen(today(),"umore",+b.dataset.mood);render();toast("Umore salvato");});
  if($("sSave"))$("sSave").onclick=()=>{const t=$("sT").value.trim(),d=$("sD").value;if(!t||!d){toast("Scrivi che cosa e la data");return;}
    const o={t,d,cat:$("sC").value,ric:$("sR").value,av:+$("sA").value,note:$("sN").value.trim()};
    if(editId){Object.assign(P.scad.find(y=>y.id===editId),o);editId=null;toast("Modificata");}else{P.scad.push(Object.assign({id:uid(),done:false},o));toast("Scadenza aggiunta");}save();render();};
  if($("sCancel"))$("sCancel").onclick=()=>{editId=null;render();};
  if($("sDel"))$("sDel").onclick=()=>{if(!confirm("Eliminare questa scadenza?"))return;P.scad=P.scad.filter(y=>y.id!==editId);editId=null;save();render();toast("Eliminata");};
  document.querySelectorAll("[data-opt]").forEach(c=>c.onchange=()=>{P.ics.opt=Object.assign({abs:true,app:true,scad:true,prat:true,pay:true,fam:true},P.ics.opt||{});P.ics.opt[c.dataset.opt]=c.checked;save();render();});
  if($("calRun"))$("calRun").onclick=runShortcut;
  if($("calClip"))$("calClip").onclick=pasteCal;
  if($("calPasteBtn"))$("calPasteBtn").onclick=pasteCal;
  if($("calPasteGo"))$("calPasteGo").onclick=()=>{importCal($("calPaste").value);};
  if($("calSym"))$("calSym").onclick=()=>{const old=()=>{try{const t=document.createElement("textarea");t.value="§";t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();const ok=document.execCommand("copy");t.remove();return ok;}catch(e){return false;}};
    const done=ok=>toast(ok?"§ copiato":"Non riesco a copiare: tieni premuto sul simbolo § e scegli Copia");
    try{navigator.clipboard.writeText("§").then(()=>done(true),()=>done(old()));}catch(e){done(old());}};
  if($("calClear"))$("calClear").onclick=()=>{if(!confirm("Togliere gli eventi presi dal Calendario?"))return;P.cal={at:null,ev:[]};save();render();};
  document.querySelectorAll("[data-c2s]").forEach(b=>b.onclick=()=>{const e=(P.cal.ev||[]).find(x=>x.k===b.dataset.c2s);if(!e)return;P.scad.push({id:uid(),t:e.t,d:e.d,cat:/lavoro/i.test(e.cal)?"pratica":"altro",ric:"no",av:1,note:e.loc||"",done:false,fromCal:1});save();render();toast("Aggiunta alle scadenze");});
  if($("icsNew"))$("icsNew").onclick=()=>exportIcs(false);
  if($("icsAll"))$("icsAll").onclick=()=>exportIcs(true);
  [["bS","sonno",v=>{const n=parseFloat(String(v).replace(",","."));return n>0&&n<=16?n:"";}],["bP","passi",v=>v?+v:""],["bE","energia",v=>v?+v:""],["bN","note",v=>v.trim()]].forEach(([id,k,f])=>{if($(id))$(id).onchange=e=>{setBen(today(),k,f(e.target.value));toast("Salvato");if(k!=="note")setTimeout(render,50);};});
}
async function exportIcs(all){
  const opt=P.ics.opt||{abs:true,app:true,scad:true,prat:true,pay:true,fam:true},items=icsItems(opt),list=all?items:items.filter(i=>P.ics.sent[i.uid]!==i.sig);
  if(!list.length){toast("Niente di nuovo da aggiungere");return;}
  const txt=icsText(list),fn="pianificazione-"+today()+".ics",mark=()=>{if(all)P.ics.sent={};list.forEach(i=>P.ics.sent[i.uid]=i.sig);save();render();};
  try{const f=new File([txt],fn,{type:"text/calendar"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Pianificazione"});mark();return;}}catch(e){if(e&&e.name==="AbortError")return;}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));a.download=fn;document.body.appendChild(a);a.click();a.remove();mark();}catch(e){toast("Non riesco a creare il file");}
}
window.addEventListener("hashchange",()=>{const k=(location.hash||"").slice(1);if(k&&k!==cur&&SECT.some(x=>x[0]===k)){cur=k;render();}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){render();valePull(false);}});
window.addEventListener("online",()=>valePull(false));setInterval(()=>valePull(false),30*60e3);
window.__pn={dayData,licOver,icsItems,icsText,licCalc,licS,absBlocks,nextPayments,monthTotals,proj:()=>projection(),get P(){return P;}};
render(); recover(); setTimeout(()=>valePull(false),800); setTimeout(ghDaily,1500);
</script>
<script>
/* ===== Aggiornamento automatico e controllo versione (uguale in tutte le sezioni di Pianificazione: costruita da comune/barra.html) =====
   - all'apertura, al ritorno sull'app e ogni 30 minuti legge version.json saltando ogni copia vecchia (anche quella del server di GitHub);
   - se c'è una versione nuova salva i dati e ricarica, ma mai mentre si sta compilando qualcosa o durante una seduta;
   - in fondo a ogni sezione: versione installata, data, stato e pulsante «Cerca aggiornamenti». */
(function(){
  "use strict";
  var V=window.APP_VERSION||"", BUILT=window.APP_BUILD||"";
  var st={state:"idle",last:null,remote:null,pending:false};
  function visible(id){var e=document.getElementById(id);if(!e||e.hidden)return false;if(e.classList&&e.classList.contains("hide"))return false;return getComputedStyle(e).display!=="none";}
  function busy(){var a=document.activeElement;return visible("sheet")||visible("modal")||visible("player")||!!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.type!=="file");}
  function fmtBuilt(){if(!BUILT)return "";try{return new Date(BUILT).toLocaleString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}
  var TXT={idle:"",checking:"controllo in corso…",ok:"è l’ultima versione",new:"nuova versione trovata: aggiorno…",wait:"nuova versione pronta: si installa appena chiudi la finestra aperta",offline:"senza internet: controllo al prossimo collegamento"};
  function paint(){
    var bars=document.querySelectorAll(".updbar");
    for(var i=0;i<bars.length;i++){var b=bars[i];
      var sv=b.querySelector(".u-sv"); if(sv)sv.innerHTML=svTxt();
      b.querySelector(".u-st").textContent=TXT[st.state]+(st.last&&st.state==="ok"?" (verificato alle "+st.last.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})+")":"");
      b.dataset.st=st.state;}
  }
  function bar(){
    if(document.querySelector(".updbar"))return;
    var css=document.createElement("style");
    css.textContent=".updbar{max-width:1100px;margin:22px auto 8px;padding:10px 16px;font-size:12.5px;color:#7a8290;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;text-align:center}"+
      ".updbar b{font-variant-numeric:tabular-nums}.updbar button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 12px;background:rgba(127,127,127,.16);color:inherit;cursor:pointer}"+
      ".updbar[data-st=ok] .u-st{color:#2e8b57}.updbar[data-st=new] .u-st,.updbar[data-st=wait] .u-st{color:#c2410c;font-weight:700}";
    document.head.appendChild(css);
    var d=document.createElement("div");d.className="updbar";
    d.innerHTML="<span class=\"u-sv\" style=\"flex-basis:100%\"></span><button type=\"button\" class=\"u-bk\">💾 Salva copia su File / iCloud</button><span>Versione <b>"+V+"</b>"+(BUILT?" del "+fmtBuilt():"")+"</span><span class=\"u-st\"></span><button type=\"button\">Cerca aggiornamenti</button>";
    d.querySelector(".u-bk").addEventListener("click",exportAll);
    d.querySelectorAll("button")[1].addEventListener("click",function(){check(true);});
    // nelle sezioni con più pagine la barra va in fondo al documento, sopra la barra delle schede
    document.body.insertBefore(d,document.querySelector("nav.tabs")||null);
    paint();
  }
  /* ---------- salvataggio automatico comune a tutte le sezioni ----------
     Ogni sezione salva subito le proprie modifiche sul dispositivo. Qui, da qualsiasi sezione:
     copia giornaliera completa (Pianificazione + Licenze + Tai Chi + Progressi) negli ultimi 30 giorni e copia su File / iCloud. */
  function lsJ(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
  function dumpAll(){
    var S=lsJ("licenze-marco-v1"), tc={}, n=0;
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("tc_")===0){tc[k]=localStorage.getItem(k);n++;}}}catch(e){}
    var pack=lsJ("prog-vale-v1"), link=lsJ("prog-link-v1");
    var pg=pack||link?{pack:pack,hist:lsJ("prog-vale-hist-v1")||[],link:link}:null;
    var pn=lsJ("pn-v1");
    if(!S&&!n&&!pg&&!pn)return null;
    var o={}; if(S)for(var x in S)o[x]=S[x]; o.taichi=tc; o.progressi=pg; if(pn)o.pianifica=pn; o.app="le-mie-app"; return o;
  }
  function kvDb(){return new Promise(function(res,rej){try{var r=indexedDB.open("licenze-marco",1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv");};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
  function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
  var snapBusy=false;
  function snapAll(){
    if(snapBusy)return; var o=dumpAll(); if(!o)return; snapBusy=true;
    kvDb().then(function(db){return new Promise(function(res){
      var tx=db.transaction("kv","readwrite"),st=tx.objectStore("kv"),k="snap-"+today();
      st.put(JSON.stringify(o),k);
      var q=st.getAllKeys(); q.onsuccess=function(){var ks=q.result.map(String).filter(function(x){return x.indexOf("snap-")===0&&x.indexOf("~")<0;});if(ks.indexOf(k)<0)ks.push(k);ks.sort();ks.slice(0,Math.max(0,ks.length-30)).forEach(function(old){st.delete(old);});};
      tx.oncomplete=function(){try{localStorage.setItem("mie-app-lastSnap",new Date().toISOString());}catch(e){}res();paint();};tx.onerror=function(){res();};
    });}).catch(function(){}).then(function(){snapBusy=false;});
  }
  function exportAll(){
    var b=document.getElementById("bExport"); if(b){b.click();setTimeout(paint,1500);return;}   // in Licenze usa il pulsante della pagina
    var o=dumpAll(); if(!o){alertBar("Ancora nessun dato da salvare");return;}
    var data=JSON.stringify(o,null,1), fn="marco-backup-"+today()+".json";
    var done=function(){var t=new Date().toISOString();try{localStorage.setItem("mie-app-lastBackup",t);localStorage.setItem("tc_lastBackup",JSON.stringify(t));}catch(e){}paint();};
    try{var f=new File([data],fn,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Copia Pianificazione"}).then(done,function(){});return;}}catch(e){}
    try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=fn;document.body.appendChild(a);a.click();a.remove();done();}catch(e){}
  }
  function alertBar(t){var e=document.querySelector(".updbar .u-sv");if(e)e.textContent=t;}
  function when(t){if(!t)return "mai";var d=new Date(t),o=new Date();return d.toDateString()===o.toDateString()?"oggi "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("it-IT",{day:"numeric",month:"short"});}
  function svTxt(){var sn=null,bk=null;try{sn=localStorage.getItem("mie-app-lastSnap");bk=localStorage.getItem("mie-app-lastBackup");var S=lsJ("licenze-marco-v1");if(S&&S.lastBackup&&(!bk||S.lastBackup>bk))bk=S.lastBackup;}catch(e){}
    var old=!bk||(Date.now()-new Date(bk).getTime())>7*864e5;
    return "💾 Salvataggio automatico attivo · copia del giorno: "+when(sn)+" · copia su File/iCloud: <span"+(old?" style=\"color:#c2410c;font-weight:700\"":"")+">"+when(bk)+"</span>";}

  function apply(v){
    try{if(typeof window.__flush==="function")window.__flush();}catch(e){}
    setTimeout(function(){location.replace(location.pathname+"?v="+encodeURIComponent(v));},350);
  }
  function check(manual){
    if(!/^https?:/.test(location.protocol))return;
    st.state="checking";paint();
    if(window.__swreg)window.__swreg.update().catch(function(){});
    fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(v){
      st.last=new Date();st.remote=v&&v.v;
      if(st.remote&&st.remote!==V){
        if(manual||!busy()){st.state="new";paint();apply(st.remote);}
        else{st.state="wait";st.pending=true;paint();}
      }else{st.state="ok";paint();}
    }).catch(function(){st.state="offline";paint();});
  }
  setInterval(function(){if(st.pending&&!busy()){st.pending=false;st.state="new";paint();apply(st.remote);}},5000);
  if(location.search.indexOf("v=")>=0&&history.replaceState){try{history.replaceState(null,"",location.pathname+location.hash);}catch(e){}}
  setTimeout(snapAll,3000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")snapAll();else paint();});
  window.addEventListener("pagehide",snapAll);
  setInterval(snapAll,15*60*1000);
  window.__snapAll=snapAll;
  window.__exportAll=exportAll;
  if(window.claude||window.top!==window){ // dentro Claude: niente aggiornamento automatico, solo la versione
    if(document.readyState!=="loading")bar();else document.addEventListener("DOMContentLoaded",bar);
    return;
  }
  if(document.readyState!=="loading")bar();else document.addEventListener("DOMContentLoaded",bar);
  if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){
    navigator.serviceWorker.register("sw.js").then(function(reg){window.__swreg=reg;}).catch(function(){});
  }
  check(false);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")check(false);});
  window.addEventListener("pageshow",function(e){if(e.persisted)check(false);});
  setInterval(function(){check(false);},30*60*1000);
})();
</script>
