<div id="lockScr" role="dialog" aria-modal="true" aria-label="App bloccata"><div class="lk">
  <div class="lk-i">🔒</div><h1>Pianificazione</h1><p id="lkMsg">Sblocca con Face ID per continuare.</p>
  <button type="button" class="go" id="lkGo">Sblocca con Face ID</button>
  <div id="lkPinBox" hidden><input id="lkPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="codice di riserva"><div class="err" id="lkErr"></div><button type="button" class="go" id="lkPinGo">Entra</button></div>

<script>
/* ================= BLOCCO CON FACE ID (comune a tutte le pagine di Pianificazione) =================
   - usa una passkey del dispositivo (WebAuthn): l'iPad chiede Face ID, o il codice dell'iPad se il volto non viene riconosciuto;
   - nessun server: la chiave pubblica resta su questo dispositivo e la firma si verifica qui;
   - codice di riserva (4–8 cifre) se la passkey non fosse disponibile;
   - si riblocca dopo 5 minuti fuori dall'app. I dati restano dove sono: il blocco protegge l'apertura, non cifra i dati. */
(function(){
  "use strict";
  var KEY="pn-lock", SES="pn-unlocked", IDLE=5*60*1000;
  function cfg(){try{return JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){return null;}}
  var C=cfg(), root=document.documentElement;
  function unlocked(){try{var t=+sessionStorage.getItem(SES)||0;return t&&Date.now()-t<IDLE;}catch(e){return false;}}
  function mark(){try{sessionStorage.setItem(SES,String(Date.now()));}catch(e){}}
  if(C&&C.on&&!unlocked())root.classList.add("locked");
  var b64=function(buf){var s="",a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");};
  var unb64=function(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};
  function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
  async function sha(t){var h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return b64(h);}
  // firma ES256 (DER) → formato grezzo r|s per WebCrypto
  function der2raw(d){var i=2;if(d[1]&0x80)i+=d[1]&0x7f;function int(){i++;var l=d[i++];var v=d.slice(i,i+l);i+=l;while(v.length>32&&v[0]===0)v=v.slice(1);var o=new Uint8Array(32);o.set(v,32-v.length);return o;}var r=int(),s=int(),out=new Uint8Array(64);out.set(r,0);out.set(s,32);return out;}
  async function verify(pkB64,authData,clientJSON,sig){
    try{var key=await crypto.subtle.importKey("spki",unb64(pkB64),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
      var ch=new Uint8Array(await crypto.subtle.digest("SHA-256",clientJSON)),ad=new Uint8Array(authData),data=new Uint8Array(ad.length+ch.length);data.set(ad,0);data.set(ch,ad.length);
      return await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,der2raw(new Uint8Array(sig)),data);}catch(e){return null;}
  }
  function done(){mark();root.classList.remove("locked");try{window.dispatchEvent(new Event("pn-unlocked"));}catch(e){}}
  function msg(t){var e=document.getElementById("lkMsg");if(e)e.textContent=t;}
  var busy=false;
  async function faceId(){
    C=cfg(); if(!C||!C.id){showPin();return;}
    if(busy)return; busy=true; msg("Guarda l’iPad…");
    try{
      var chal=rnd(32);
      var a=await navigator.credentials.get({publicKey:{challenge:chal,rpId:location.hostname,allowCredentials:[{type:"public-key",id:unb64(C.id)}],userVerification:"required",timeout:60000}});
      var r=a.response,cj=JSON.parse(new TextDecoder().decode(r.clientDataJSON));
      if(cj.type!=="webauthn.get"||cj.challenge!==b64(chal))throw new Error("risposta non valida");
      var flags=new Uint8Array(r.authenticatorData)[32];if(!(flags&4))throw new Error("verifica del volto non fatta");
      if(C.pk){var ok=await verify(C.pk,r.authenticatorData,r.clientDataJSON,r.signature);if(ok===false)throw new Error("firma non valida");}
      done();
    }catch(e){msg(e&&e.name==="NotAllowedError"?"Tocca «Sblocca con Face ID» per riprovare, o usa il codice di riserva.":"Non riuscito: riprova o usa il codice di riserva.");}
    busy=false;
  }
  function showPin(){var b=document.getElementById("lkPinBox");if(b){b.hidden=false;var i=document.getElementById("lkPin");if(i)i.focus();}}
  async function pin(){var v=(document.getElementById("lkPin").value||"").trim();C=cfg();
    if(C&&C.pin&&await sha("pn-pin:"+v)===C.pin){done();document.getElementById("lkPin").value="";document.getElementById("lkErr").textContent="";}
    else{document.getElementById("lkErr").textContent="Codice sbagliato";}}
  function wire(){
    var g=document.getElementById("lkGo");if(!g)return;
    g.onclick=faceId;document.getElementById("lkAlt").onclick=showPin;document.getElementById("lkPinGo").onclick=pin;
    document.getElementById("lkPin").onkeydown=function(e){if(e.key==="Enter")pin();};
    if(root.classList.contains("locked"))faceId();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",wire);else wire();
  // si riblocca dopo 5 minuti fuori dall'app
  document.addEventListener("visibilitychange",function(){C=cfg();if(!C||!C.on)return;
    if(document.visibilityState==="hidden"){if(!root.classList.contains("locked"))mark();}else if(!unlocked()){root.classList.add("locked");msg("Sblocca con Face ID per continuare.");faceId();}});
  setInterval(function(){if(!root.classList.contains("locked")&&document.visibilityState==="visible")mark();},30000);

  /* ---------- attivazione (usata dalla pagina Pianificazione → 🔒 Blocco) ---------- */
  window.__pnLock={
    cfg:cfg,
    available:async function(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}},
    enable:async function(pinCode){
      if(!/^\d{4,8}$/.test(pinCode||""))throw new Error("Il codice di riserva deve avere da 4 a 8 cifre");
      var c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:"Pianificazione",id:location.hostname},
        user:{id:rnd(16),name:"pianificazione",displayName:"Pianificazione"},pubKeyCredParams:[{type:"public-key",alg:-7}],
        authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},timeout:60000,attestation:"none"}});
      var pk=null;try{pk=c.response.getPublicKey?b64(c.response.getPublicKey()):null;}catch(e){}
      localStorage.setItem(KEY,JSON.stringify({on:true,id:b64(c.rawId),pk:pk,pin:await sha("pn-pin:"+pinCode),at:new Date().toISOString()}));mark();return true;
    },
    disable:function(){localStorage.removeItem(KEY);try{sessionStorage.removeItem(SES);}catch(e){}},
    lockNow:function(){try{sessionStorage.removeItem(SES);}catch(e){}if(cfg())root.classList.add("locked");msg("Sblocca con Face ID per continuare.");}
  };
})();
</script>

<script>
/* ================= PIANIFICAZIONE =================
   Sezioni: Oggi · Scadenze · Calendario (esporta) · Famiglia · Conti · Benessere.
   Tutti i dati restano su questo dispositivo: localStorage «pn-v1» + copia nel database del dispositivo (IndexedDB «licenze-marco», voce «pianifica»)
   + copie giornaliere e copia su File/iCloud insieme a Licenze, Tai Chi e Progressi (barra in fondo). Nessun dato personale nel codice. */
"use strict";
const HOL={"2026-11-01":"Ognissanti","2026-12-08":"Immacolata","2026-12-25":"Natale","2026-12-26":"S. Stefano",
"2027-01-01":"Capodanno","2027-01-06":"Epifania","2027-03-28":"Pasqua","2027-03-29":"Pasquetta",
"2027-04-25":"Liberazione","2027-05-01":"Festa del Lavoro","2027-06-02":"Festa della Repubblica"};
const DEF={start:"",end:"2027-05-31",bal:{lo25:21,lo26:39,lo27:16,rl26:4,rl27:2},defIn:"08:00",defOut:"14:00",days:{},week:{}};
const PROV_START="2026-10-16";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12);};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const today=()=>iso(new Date());
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d);};
const fmt=(s,o)=>parse(s).toLocaleDateString("it-IT",o||{weekday:"short",day:"numeric",month:"short"});
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lsJ=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
const rel=d=>{const n=diff(today(),d);return n===0?"oggi":n===1?"domani":n===-1?"ieri":n<0?(-n)+" giorni fa":"tra "+n+" giorni";};
const euro=n=>(Math.round((+n||0)*100)/100).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
const GIORNI=["lunedì","martedì","mercoledì","giovedì","venerdì","sabato","domenica"];
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800);}

/* ---------- dati e salvataggio ---------- */
const KEY="pn-v1";
const DEF_PN={ver:1,scad:[],fam:{att:[],ev:[]},conti:{ric:[],mov:[],hide:false},ben:{d:{}},ics:{sent:{}},cal:{at:null,ev:[]},savedAt:null};
function normalize(o){const d=JSON.parse(JSON.stringify(DEF_PN));if(o&&typeof o==="object"){Object.assign(d,o);d.fam=Object.assign({att:[],ev:[]},o.fam||{});d.conti=Object.assign({ric:[],mov:[],hide:false},o.conti||{});d.ben=Object.assign({d:{}},o.ben||{});d.ics=Object.assign({sent:{}},o.ics||{});d.cal=Object.assign({at:null,ev:[]},o.cal||{});d.scad=Array.isArray(o.scad)?o.scad:[];}return d;}
let P=normalize(lsJ(KEY));
function kv(mode,key,val){return new Promise((res,rej)=>{try{const r=indexedDB.open("licenze-marco",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv");};
  r.onsuccess=()=>{try{const tx=r.result.transaction("kv",mode),st=tx.objectStore("kv");const q=mode==="readonly"?st.get(key):st.put(val,key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e);}};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
let saveT=null;
function save(){P.savedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}clearTimeout(saveT);saveT=setTimeout(()=>{kv("readwrite","pianifica",JSON.stringify(P)).catch(()=>{});},400);paintSaved();}
window.__flush=()=>{try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}kv("readwrite","pianifica",JSON.stringify(P)).catch(()=>{});};
function paintSaved(){const e=$("pnSaved");if(e)e.textContent=P.savedAt?"✓ Salvato su questo dispositivo · "+new Date(P.savedAt).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"";}

function licCalc(S){ // stesso calcolo della sezione Licenze: saldi consumati giorno per giorno fino al congedo
  const st=S.start||PROV_START,en=S.end,t=today(),b=Object.assign({},S.bal);let pLeft=0;
  for(let s=st;s<=en;s=add(s,1)){if(kind(s)!=="LAV")continue;const c=(S.days[s]&&S.days[s].c)||"P",y27=s>="2027-01-01";
    if(c==="LP"){if(b.lo25>0)b.lo25--;else if(y27&&b.lo26>0)b.lo26--;}
    else if(c==="LO"){if(!y27){if(b.lo26>0)b.lo26--;}else if(b.lo27>0)b.lo27--;}

function licDay(S,s){ // che cosa faccio quel giorno
  const k=kind(s);if(!S)return{k,c:null,t:k==="LAV"?"":k==="WE"?"fine settimana":"festivo"};
  const st=S.start||PROV_START;if(s<st||s>S.end)return{k,c:"OUT",t:s<st?"prima del rientro":"in congedo"};

}

  ["altro","📦","Altro",null]

const KCAT=Object.fromEntries(KCATS.map(c=>[c[0],c]));
const catName=id=>(KCAT[id]||KCAT.altro)[1]+" "+(KCAT[id]||KCAT.altro)[2];

/* ---------- dati ---------- */
function C(){const c=P.conti;["acc","mov","ric","rules"].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[];});if(!c.bud)c.bud={};if(!c.proj)c.proj={};
  c.mov.forEach(m=>{if(!m.cat)m.cat=m.tipo==="e"?"entrate":"altro";});return c;}
const cents=n=>Math.round((+n||0)*100);
const normDesc=s=>String(s||"").toLowerCase().replace(/\s+/g," ").replace(/[^a-z0-9àèéìòù ]/g,"").trim();
function movHash(acc,d,signed,desc){return acc+"|"+d+"|"+cents(signed)+"|"+normDesc(desc).slice(0,24);}
function guessCat(desc,signed){const s=" "+String(desc||"").toLowerCase()+" ";
  for(const r of C().rules)if(r.k&&s.includes(r.k))return r.cat;
  for(const c of KCATS)if(c[3]&&c[3].test(s)){if(signed>0&&!["stipendio","giro","saldocarta"].includes(c[0]))return "entrate";return c[0];}
  return signed>0?"entrate":"altro";}
const hasCardMov=()=>{const c=C();const cards=new Set(c.acc.filter(a=>a.tipo==="credito").map(a=>a.id));return c.mov.some(m=>cards.has(m.acc));};
const isTransfer=m=>m.cat==="giro"||(m.cat==="saldocarta"&&hasCardMov());
function accBal(a){const c=C();let b=+a.s0||0;c.mov.forEach(m=>{if(m.acc===a.id&&(!a.d0||m.d>a.d0))b+=m.tipo==="e"?+m.imp:-m.imp;});return b;}
function totBal(){return C().acc.filter(a=>a.tipo!=="credito").reduce((s,a)=>s+accBal(a),0);} // le carte di credito si pagano dal conto: non si sommano due volte

/* ---------- ricorrenti, rate e trattenute ---------- */
function ricDates(r,from,to){const out=[],step=(FREQ[r.freq]||FREQ.m)[1];let d=r.d0||from;if(!d)return out;
  let x=parse(d),guard=0;while(iso(x)<from&&guard++<600){x.setMonth(x.getMonth()+step);}
  guard=0;while(iso(x)<=to&&guard++<400){if(r.fine&&iso(x)>r.fine)break;out.push(iso(x));x.setMonth(x.getMonth()+step);}return out;}
function ricLeft(r){if(!r.fine)return null;const n=ricDates(r,today(),r.fine).length;return{n,tot:n*(+r.imp||0)};}
function nextPayments(days){const t=today(),to=add(t,days),out=[];C().ric.forEach(r=>ricDates(r,t,to).forEach(d=>out.push({d,r})));return out.sort((a,b)=>a.d<b.d?-1:1);}

/* ---------- totali ---------- */
function monthEnd(ym){return iso(new Date(+ym.slice(0,4),+ym.slice(5,7),0));}
function monthActual(ym){const from=ym+"-01",to=monthEnd(ym);let e=0,u=0;const per={};
  C().mov.forEach(m=>{if(m.d<from||m.d>to||isTransfer(m))return;const v=+m.imp||0;if(m.tipo==="e")e+=v;else{u+=v;per[m.cat]=(per[m.cat]||0)+v;}});return{e,u,per};}
function monthTotals(ym){const a=monthActual(ym);if(C().mov.some(m=>m.d.slice(0,7)===ym))return a;
  let e=0,u=0;C().ric.forEach(r=>{const n=ricDates(r,ym+"-01",monthEnd(ym)).length;if(r.tipo==="e")e+=n*(+r.imp||0);else u+=n*(+r.imp||0);});return{e,u,per:{},prev:true};}
function lastMonths(n){const out=[],d=parse(today());d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(iso(x).slice(0,7));}return out;}
const MESE=ym=>parse(ym+"-01").toLocaleDateString("it-IT",{month:"short",year:"2-digit"});

/* ---------- importazione ---------- */
const H={date:/^(data( operazione| contabile| movimento| registrazione)?|booking date|date|data op\.?)$/,valuta:/valuta|value date/,
  amount:/^(importo( \(?eur\)?| in euro)?|amount( \(eur\))?|importo eur|ammontare)$/,credit:/^(entrate|avere|accrediti?|entrata)$/,debit:/^(uscite|dare|addebiti?|uscita)$/,
  desc:/descrizione|causale|partner name|payee|payment reference|dettagli|beneficiario|operazione|merchant|esercente/,status:/^(stato( operazione)?|status)$/};
const low=v=>String(v==null?"":v).trim().toLowerCase();
function detect(rows){let best=null;
  for(let i=0;i<Math.min(rows.length,40);i++){const r=(rows[i]||[]).map(low);let date=-1,amount=-1,credit=-1,debit=-1,status=-1;const desc=[];
    r.forEach((h,j)=>{if(!h)return;if(date<0&&H.date.test(h))date=j;else if(amount<0&&H.amount.test(h))amount=j;else if(credit<0&&H.credit.test(h))credit=j;else if(debit<0&&H.debit.test(h))debit=j;else if(status<0&&H.status.test(h))status=j;else if(H.desc.test(h)&&!H.valuta.test(h))desc.push(j);});
    const score=(date>=0)*2+((amount>=0)||(credit>=0||debit>=0))*2+(desc.length>0);
    if(date>=0&&(amount>=0||credit>=0||debit>=0)&&(!best||score>best.score))best={row:i,score,date,amount,credit,debit,status,desc:desc.slice(0,2)};}
  return best;}
function parseDateCell(v){if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return d.toISOString().slice(0,10);}
  const s=String(v||"").trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return y+"-"+pad(+m[2])+"-"+pad(+m[1]);}return null;}
function parseAmt(v){if(typeof v==="number")return v;let s=String(v||"").replace(/[€\s]|eur/gi,"").trim();if(!s)return null;
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}if(/-$/.test(s)){neg=true;s=s.slice(0,-1);}if(/^[-−]/.test(s)){neg=true;s=s.slice(1);}if(/^\+/.test(s))s=s.slice(1);
  const lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");if(lc>ld)s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");
  const n=parseFloat(s);return isNaN(n)?null:(neg?-n:n);}
let IMP=null; // importazione in corso: {acc,rows,map,file}
function buildImport(){const I=IMP,a=C().acc.find(x=>x.id===I.acc),M=I.map,out=[],seen=new Set(C().mov.map(m=>m.h)),occ={};let dup=0,skip=0,pend=0;
  for(let i=M.row+1;i<I.rows.length;i++){const r=I.rows[i]||[];const d=parseDateCell(r[M.date]);if(!d){skip++;continue;}
    let v=null;if(M.amount>=0)v=parseAmt(r[M.amount]);else{const cr=M.credit>=0?parseAmt(r[M.credit]):null,db=M.debit>=0?parseAmt(r[M.debit]):null;v=(cr?Math.abs(cr):0)-(db?Math.abs(db):0);if(!cr&&!db)v=null;}
    if(v==null||!v){skip++;continue;}
    const desc=M.desc.map(j=>String(r[j]==null?"":r[j]).trim()).filter(Boolean).filter((x,k,arr)=>arr.indexOf(x)===k).join(" · ")||"(senza descrizione)";
    if(/^totale/i.test(desc)){skip++;continue;}
    const st=M.status>=0?low(r[M.status]):"",p=/autorizzat|in lavorazione|pending|prenotat|da contabilizzare/.test(st)?1:0;
    const h0=movHash(a.id,d,v,desc),nth=occ[h0]=(occ[h0]||0)+1,h=nth>1?h0+"#"+nth:h0; // due spese identiche nello stesso file contano entrambe
    if(seen.has(h)){dup++;continue;}if(p)pend++;
    out.push({id:uid(),d,t:desc,imp:Math.round(Math.abs(v)*100)/100,tipo:v>0?"e":"u",cat:guessCat(desc,v),acc:a.id,h,src:"file",p});}
  // nello stesso file: un movimento «in attesa» che compare anche contabilizzato si tiene una volta sola
  const booked=out.filter(m=>!m.p);const fin=out.filter(m=>!m.p||!booked.some(b=>b.tipo===m.tipo&&cents(b.imp)===cents(m.imp)&&Math.abs(diff(b.d,m.d))<=6&&!b._used&&(b._used=1)));
  booked.forEach(b=>delete b._used);const dropped=out.length-fin.length;
  return{out:fin,dup:dup+dropped,skip,pend:pend-dropped};}
function commitImport(){const R=buildImport(),c=C();
  // movimenti «in attesa» già presenti che ora arrivano contabilizzati: sostituiti
  R.out.filter(m=>!m.p).forEach(m=>{const k=c.mov.findIndex(x=>x.p&&x.acc===m.acc&&x.tipo===m.tipo&&cents(x.imp)===cents(m.imp)&&Math.abs(diff(x.d,m.d))<=6);if(k>=0)c.mov.splice(k,1);});
  c.mov.push(...R.out);const a=c.acc.find(x=>x.id===IMP.acc);a.map=Object.assign({},IMP.map,{sig:IMP.sig});a.last=today();IMP=null;save();toast("📥 "+R.out.length+" movimenti importati"+(R.dup?" · "+R.dup+" già presenti":"")+(a.rec||a.tipo==="credito"?"":" · ora imposta il saldo con «Riconcilia»"));return R;}
async function readImportFile(file,accId){const u8=new Uint8Array(await file.arrayBuffer());const rows=await Fogli.readTable(u8);
  const a=C().acc.find(x=>x.id===accId);const det=detect(rows);if(!det)throw new Error("Non trovo le colonne Data e Importo in questo file");
  const sig=(rows[det.row]||[]).map(low).join("|");const map=a.map&&a.map.sig===sig?Object.assign({},a.map):det;delete map.sig;
  IMP={acc:accId,rows,map,sig,file:file.name};}

/* ---------- proiezione «Dopo il congedo» ---------- */
function projDefaults(){const c=C(),pr=c.proj,S=typeof licS==="function"?licS():null;
  return{stip:pr.stip||((c.ric.find(r=>r.tipo==="e"&&/stipend|emolum|noipa|cedolino/i.test(r.t))||{}).id||""),nuovo:pr.nuovo!=null?pr.nuovo:"",dal:pr.dal||(S&&S.end?add(S.end,1):""),mesi:pr.mesi||24,var:pr.var,extra:pr.extra||[]};}
function varEstimate(){const ms=lastMonths(4).slice(0,3);let tot=0,n=0;ms.forEach(ym=>{const a=monthActual(ym);if(!a.u)return;let ru=0;C().ric.forEach(r=>{if(r.tipo!=="e")ru+=ricDates(r,ym+"-01",monthEnd(ym)).length*(+r.imp||0);});tot+=Math.max(0,a.u-ru);n++;});return n?Math.round(tot/n):null;}
function projection(){const c=C(),D=projDefaults(),v=D.var!=null&&D.var!==""?+D.var:(varEstimate()||0),out=[];let bal=totBal();
  const d0=parse(today());d0.setDate(1);
  for(let i=1;i<=D.mesi;i++){const m=new Date(d0.getFullYear(),d0.getMonth()+i,1),ym=iso(m).slice(0,7),from=ym+"-01",to=monthEnd(ym);let e=0,u=0;
    c.ric.forEach(r=>{const ds=ricDates(r,from,to);ds.forEach(d=>{if(r.id===D.stip&&D.dal&&d>=D.dal)return;if(r.tipo==="e")e+=+r.imp||0;else u+=+r.imp||0;});});
    if(D.nuovo&&D.dal&&from>=D.dal.slice(0,7)+"-01"&&!(D.dal>from&&D.dal.slice(0,7)===ym))e+=+D.nuovo||0;
    (D.extra||[]).forEach(x=>{if(x.d&&x.d.slice(0,7)===ym)e+=+x.imp||0;});
    u+=v;bal+=e-u;out.push({ym,e,u,bal});}
  return{rows:out,var:v,D};}

/* ---------- grafici (SVG semplici) ---------- */
function barChart12(){const ms=lastMonths(12),data=ms.map(ym=>monthActual(ym)),max=Math.max(1,...data.map(d=>Math.max(d.e,d.u))),W=640,Hh=170,bw=(W-40)/12;
  return `<svg class="chart" style="height:190px" viewBox="0 0 ${W} ${Hh+20}" role="img" aria-label="Entrate e uscite degli ultimi 12 mesi">${data.map((d,i)=>{const x=20+i*bw,he=(d.e/max)*(Hh-20),hu=(d.u/max)*(Hh-20);
    return `<rect x="${x+3}" y="${Hh-he}" width="${bw/2-4}" height="${he}" rx="3" fill="#2e7d5b"/><rect x="${x+bw/2}" y="${Hh-hu}" width="${bw/2-4}" height="${hu}" rx="3" fill="#c0392b"/><text x="${x+bw/2}" y="${Hh+14}" font-size="11" text-anchor="middle" fill="var(--muted)">${MESE(ms[i]).replace(" "," ")}</text>`;}).join("")}</svg><div class="lbl"><span style="color:#2e7d5b">■</span> entrate · <span style="color:#c0392b">■</span> uscite (senza giroconti)</div>`;}
function lineChart(rows){const W=640,Hh=170,vals=rows.map(r=>r.bal),mn=Math.min(0,...vals),mx=Math.max(1,...vals),x=i=>20+i*(W-40)/Math.max(1,rows.length-1),y=v=>10+(Hh-20)*(1-(v-mn)/(mx-mn||1));
  return `<svg class="chart" style="height:190px" viewBox="0 0 ${W} ${Hh+20}" role="img" aria-label="Saldo previsto">${mn<0?`<line x1="20" x2="${W-20}" y1="${y(0)}" y2="${y(0)}" stroke="#c0392b" stroke-dasharray="4 4"/>`:""}
    <polyline fill="none" stroke="#1f5fae" stroke-width="3" points="${rows.map((r,i)=>x(i)+","+y(r.bal)).join(" ")}"/>${rows.map((r,i)=>i%3?"":`<text x="${x(i)}" y="${Hh+14}" font-size="11" text-anchor="middle" fill="var(--muted)">${MESE(r.ym)}</text>`).join("")}</svg>`;}

/* ---------- viste ---------- */
let CT=(()=>{try{return sessionStorage.getItem("pn-ct")||"pan";}catch(e){return "pan";}})(), movF={ym:today().slice(0,7),acc:"",cat:"",q:""};
const CTABS=[["pan","Panoramica"],["mov","Movimenti"],["imp","📥 Importa"],["acc","Conti e carte"],["bud","Budget"],["ric","Ricorrenti e rate"],["proj","Dopo il congedo"]];

  return o;}
function cMov(){const c=C(),F=movF;let L=c.mov.filter(m=>(!F.ym||m.d.slice(0,7)===F.ym)&&(!F.acc||m.acc===F.acc)&&(!F.cat||m.cat===F.cat)&&(!F.q||normDesc(m.t).includes(normDesc(F.q)))).sort((a,b)=>a.d<b.d?1:-1);

/* ---------- eventi dal Calendario dell'iPad (tramite il Comando Rapido «Aggiorna Pianificazione») ----------
   Il Comando Rapido copia negli appunti una riga per evento: inizio§fine§titolo§calendario§tutto il giorno§luogo
   (date in ISO 8601). Qui si incollano: sostituiscono la copia precedente, senza doppioni. */
const SC_NAME="Aggiorna Pianificazione";
/* date come le scrive Comandi Rapidi: ISO 8601, «05/10/26, 09:50», «5 ott 2026 alle ore 09:50», «5 ottobre 2026, 9:50», «Oct 5, 2026 at 9:50 AM» */
const MESI_IT=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"],MESI_EN=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseWhen(x){
  x=String(x||"").trim().toLowerCase();if(!x)return null;
  let m=x.match(/^(\d{4})-(\d{2})-(\d{2})(?:[t ](\d{2}):(\d{2}))?/);

  const tm=(x.match(/(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?\s*$/)||x.match(/(?:alle|ore|at|,)\s*(?:ore\s*)?(\d{1,2})[:.](\d{2})(?:\s*([ap])\.?m\.?)?/));
  let t="";if(tm){let h=+tm[1];if(tm[3]==="p"&&h<12)h+=12;if(tm[3]==="a"&&h===12)h=0;t=pad(h)+":"+tm[2];}
  const Y=y=>{y=+y;return y<100?2000+y:y;};
  m=x.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(m)return{d:Y(m[3])+"-"+pad(+m[2])+"-"+pad(+m[1]),t};
  m=x.match(/^(\d{1,2})\s+([a-zà-ù]{3,})\.?\s+(\d{4})/);
  if(m){const k=MESI_IT.indexOf(m[2].slice(0,3));if(k>=0)return{d:m[3]+"-"+pad(k+1)+"-"+pad(+m[1]),t};}
  m=x.match(/^([a-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/);
  if(m){const k=MESI_EN.indexOf(m[1].slice(0,3));if(k>=0)return{d:m[3]+"-"+pad(k+1)+"-"+pad(+m[2]),t};}
  return null;
}
function parseCal(txt){
  const out=[],seen=new Set();
  String(txt||"").split(/\r?\n/).forEach(l=>{const f=l.split("§").map(z=>z.trim());if(f.length<2)return;
    // formati accettati: inizio§fine§titolo§calendario§luogo  (anche: inizio§titolo§calendario, e la vecchia riga con «tutto il giorno»)
    let S=parseWhen(f[0]),E=parseWhen(f[1]),t,cal,loc,adf=null;
    if(E){t=f[2]||"";cal=f[3]||"";if(/^(s[iì]|no|yes|true|false|1|0|vero|falso)$/i.test(f[4]||"")){adf=/^(s[iì]|yes|true|1|vero)$/i.test(f[4]);loc=f[5]||"";}else loc=f[4]||"";}
    else{t=f[1]||"";cal=f[2]||"";loc=f[3]||"";E=S;}
    if(!S||!t)return;
    if(/festivit|holiday/i.test(cal))return; // le festività le conosce già l'app
    const ad=adf!=null?adf:(!S.t||S.t==="00:00")&&(!E.t||E.t==="00:00"||E.t==="23:59");
    const k=S.d+"T"+(S.t||"")+"|"+t;if(seen.has(k))return;seen.add(k);
    let ed=E.d||S.d;if(ad&&E.t==="00:00"&&ed>S.d)ed=add(ed,-1);
    out.push({k,d:S.d,o:ad?"":S.t,f:ad||E.d!==S.d?"":E.t,ed,t,cal,ad,loc:loc.split("\n")[0]});});
  return out.sort((a,b)=>(a.d+(a.o||""))<(b.d+(b.o||""))?-1:1);
}

function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");}

  if(opt.app&&S&&S.end)items.push({uid:"congedo-"+S.end,lines:["DTSTART;VALUE=DATE:"+dval(S.end),"DTEND;VALUE=DATE:"+dval(add(S.end,1)),"SUMMARY:"+icsEsc("🎉 Congedo"),...alarm(7)]});

    items.push({uid:"pay-"+r.id,lines:["DTSTART;VALUE=DATE:"+dval(d),"DTEND;VALUE=DATE:"+dval(add(d,1)),"SUMMARY:"+icsEsc("💶 "+r.t),"RRULE:FREQ=MONTHLY;INTERVAL="+step+(r.fine?";UNTIL="+dval(r.fine):""),...alarm(2)]});});
  if(opt.fam){const BY=["MO","TU","WE","TH","FR","SA","SU"];P.fam.att.forEach(a=>{let d=t;while(((parse(d).getDay()+6)%7+1)!==+a.g)d=add(d,1);
      const tm=x=>(x||"00:00").replace(":","")+"00";items.push({uid:"fam-"+a.id,lines:["DTSTART:"+dval(d)+"T"+tm(a.o||"16:00"),"DTEND:"+dval(d)+"T"+tm(a.f||a.o||"17:00"),"SUMMARY:"+icsEsc("👨‍👧 "+(a.chi?a.chi+": ":"")+a.t),"RRULE:FREQ=WEEKLY;BYDAY="+BY[a.g-1],...(a.acc?["DESCRIPTION:"+icsEsc("Accompagna: "+a.acc)]:[])]});});
    P.fam.ev.filter(e=>e.d>=t).forEach(e=>{const tm=x=>(x||"00:00").replace(":","")+"00";items.push({uid:"fev-"+e.id,lines:e.o?["DTSTART:"+dval(e.d)+"T"+tm(e.o),"DTEND:"+dval(e.d)+"T"+tm(e.f||e.o),"SUMMARY:"+icsEsc("👨‍👧 "+e.t),...alarm(1)]:["DTSTART;VALUE=DATE:"+dval(e.d),"DTEND;VALUE=DATE:"+dval(add(e.d,1)),"SUMMARY:"+icsEsc("👨‍👧 "+e.t),...alarm(1)]});});}

<script>
/* ===== Aggiornamento automatico e controllo versione (uguale in tutte le sezioni di Pianificazione: costruita da comune/barra.html) =====
   - all'apertura, al ritorno sull'app e ogni 30 minuti legge version.json saltando ogni copia vecchia (anche quella del server di GitHub);
   - se c'è una versione nuova salva i dati e ricarica, ma mai mentre si sta compilando qualcosa o durante una seduta;
   - in fondo a ogni sezione: versione installata, data, stato e pulsante «Cerca aggiornamenti». */
(function(){
  "use strict";
  var V=window.APP_VERSION||"", BUILT=window.APP_BUILD||"";
  var st={state:"idle",last:null,remote:null,pending:false};
  function visible(id){var e=document.getElementById(id);if(!e||e.hidden)return false;if(e.classList&&e.classList.contains("hide"))return false;return getComputedStyle(e).display!=="none";}
  function busy(){var a=document.activeElement;return visible("sheet")||visible("modal")||visible("player")||!!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.type!=="file");}
  function fmtBuilt(){if(!BUILT)return "";try{return new Date(BUILT).toLocaleString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}
  var TXT={idle:"",checking:"controllo in corso…",ok:"è l’ultima versione",new:"nuova versione trovata: aggiorno…",wait:"nuova versione pronta: si installa appena chiudi la finestra aperta",offline:"senza internet: controllo al prossimo collegamento"};
  function paint(){
    var bars=document.querySelectorAll(".updbar");
    for(var i=0;i<bars.length;i++){var b=bars[i];
      var sv=b.querySelector(".u-sv"); if(sv)sv.innerHTML=svTxt();
      b.querySelector(".u-st").textContent=TXT[st.state]+(st.last&&st.state==="ok"?" (verificato alle "+st.last.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})+")":"");
      b.dataset.st=st.state;}
  }
  function bar(){
    if(document.querySelector(".updbar"))return;
    var css=document.createElement("style");
    css.textContent=".updbar{max-width:1100px;margin:22px auto 8px;padding:10px 16px;font-size:12.5px;color:#7a8290;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;text-align:center}"+
      ".updbar b{font-variant-numeric:tabular-nums}.updbar button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 12px;background:rgba(127,127,127,.16);color:inherit;cursor:pointer}"+
      ".updbar[data-st=ok] .u-st{color:#2e8b57}.updbar[data-st=new] .u-st,.updbar[data-st=wait] .u-st{color:#c2410c;font-weight:700}";
    document.head.appendChild(css);
    var d=document.createElement("div");d.className="updbar";
    d.innerHTML="<span class=\"u-sv\" style=\"flex-basis:100%\"></span><button type=\"button\" class=\"u-bk\">💾 Salva copia su File / iCloud</button><span>Versione <b>"+V+"</b>"+(BUILT?" del "+fmtBuilt():"")+"</span><span class=\"u-st\"></span><button type=\"button\">Cerca aggiornamenti</button>";
    d.querySelector(".u-bk").addEventListener("click",exportAll);
    d.querySelectorAll("button")[1].addEventListener("click",function(){check(true);});
    // nelle sezioni con più pagine la barra va in fondo al documento, sopra la barra delle schede
    document.body.insertBefore(d,document.querySelector("nav.tabs")||null);
    paint();
  }
  /* ---------- salvataggio automatico comune a tutte le sezioni ----------
     Ogni sezione salva subito le proprie modifiche sul dispositivo. Qui, da qualsiasi sezione:
     copia giornaliera completa (Pianificazione + Licenze + Tai Chi + Progressi) negli ultimi 30 giorni e copia su File / iCloud. */
  function lsJ(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
  function dumpAll(){
    var S=lsJ("licenze-marco-v1"), tc={}, n=0;
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("tc_")===0){tc[k]=localStorage.getItem(k);n++;}}}catch(e){}
    var pack=lsJ("prog-vale-v1"), link=lsJ("prog-link-v1");
    var pg=pack||link?{pack:pack,hist:lsJ("prog-vale-hist-v1")||[],link:link}:null;
    var pn=lsJ("pn-v1");
    if(!S&&!n&&!pg&&!pn)return null;
    var o={}; if(S)for(var x in S)o[x]=S[x]; o.taichi=tc; o.progressi=pg; if(pn)o.pianifica=pn; o.app="le-mie-app"; return o;
  }
  function kvDb(){return new Promise(function(res,rej){try{var r=indexedDB.open("licenze-marco",1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv");};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}
  function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
  var snapBusy=false;
  function snapAll(){
    if(snapBusy)return; var o=dumpAll(); if(!o)return; snapBusy=true;
    kvDb().then(function(db){return new Promise(function(res){
      var tx=db.transaction("kv","readwrite"),st=tx.objectStore("kv"),k="snap-"+today();
      st.put(JSON.stringify(o),k);
      var q=st.getAllKeys(); q.onsuccess=function(){var ks=q.result.map(String).filter(function(x){return x.indexOf("snap-")===0&&x.indexOf("~")<0;});if(ks.indexOf(k)<0)ks.push(k);ks.sort();ks.slice(0,Math.max(0,ks.length-30)).forEach(function(old){st.delete(old);});};
      tx.oncomplete=function(){try{localStorage.setItem("mie-app-lastSnap",new Date().toISOString());}catch(e){}res();paint();};tx.onerror=function(){res();};
    });}).catch(function(){}).then(function(){snapBusy=false;});
  }
  function exportAll(){
    var b=document.getElementById("bExport"); if(b){b.click();setTimeout(paint,1500);return;}   // in Licenze usa il pulsante della pagina
    var o=dumpAll(); if(!o){alertBar("Ancora nessun dato da salvare");return;}
    var data=JSON.stringify(o,null,1), fn="marco-backup-"+today()+".json";
    var done=function(){var t=new Date().toISOString();try{localStorage.setItem("mie-app-lastBackup",t);localStorage.setItem("tc_lastBackup",JSON.stringify(t));}catch(e){}paint();};
    try{var f=new File([data],fn,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Copia Pianificazione"}).then(done,function(){});return;}}catch(e){}
    try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=fn;document.body.appendChild(a);a.click();a.remove();done();}catch(e){}
  }
  function alertBar(t){var e=document.querySelector(".updbar .u-sv");if(e)e.textContent=t;}
  function when(t){if(!t)return "mai";var d=new Date(t),o=new Date();return d.toDateString()===o.toDateString()?"oggi "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("it-IT",{day:"numeric",month:"short"});}
  function svTxt(){var sn=null,bk=null;try{sn=localStorage.getItem("mie-app-lastSnap");bk=localStorage.getItem("mie-app-lastBackup");var S=lsJ("licenze-marco-v1");if(S&&S.lastBackup&&(!bk||S.lastBackup>bk))bk=S.lastBackup;}catch(e){}
    var old=!bk||(Date.now()-new Date(bk).getTime())>7*864e5;
    return "💾 Salvataggio automatico attivo · copia del giorno: "+when(sn)+" · copia su File/iCloud: <span"+(old?" style=\"color:#c2410c;font-weight:700\"":"")+">"+when(bk)+"</span>";}

  function apply(v){
    try{if(typeof window.__flush==="function")window.__flush();}catch(e){}
    setTimeout(function(){location.replace(location.pathname+"?v="+encodeURIComponent(v));},350);
  }
  function check(manual){
    if(!/^https?:/.test(location.protocol))return;
    st.state="checking";paint();
    if(window.__swreg)window.__swreg.update().catch(function(){});
    fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(v){
      st.last=new Date();st.remote=v&&v.v;
      if(st.remote&&st.remote!==V){
        if(manual||!busy()){st.state="new";paint();apply(st.remote);}
        else{st.state="wait";st.pending=true;paint();}
      }else{st.state="ok";paint();}
    }).catch(function(){st.state="offline";paint();});
  }
  setInterval(function(){if(st.pending&&!busy()){st.pending=false;st.state="new";paint();apply(st.remote);}},5000);
  if(location.search.indexOf("v=")>=0&&history.replaceState){try{history.replaceState(null,"",location.pathname+location.hash);}catch(e){}}
  setTimeout(snapAll,3000);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")snapAll();else paint();});
  window.addEventListener("pagehide",snapAll);
  setInterval(snapAll,15*60*1000);
  window.__snapAll=snapAll;
  window.__exportAll=exportAll;
  if(window.claude||window.top!==window){ // dentro Claude: niente aggiornamento automatico, solo la versione
    if(document.readyState!=="loading")bar();else document.addEventListener("DOMContentLoaded",bar);
    return;
  }
  if(document.readyState!=="loading")bar();else document.addEventListener("DOMContentLoaded",bar);
  if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){
    navigator.serviceWorker.register("sw.js").then(function(reg){window.__swreg=reg;}).catch(function(){});
  }
  check(false);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")check(false);});
  window.addEventListener("pageshow",function(e){if(e.persisted)check(false);});
  setInterval(function(){check(false);},30*60*1000);
})();
</script>
